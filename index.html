<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Boutique Artisan Coffee Bar | 3D Architectural Experience</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0b0907;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      color: #f7eedf;
    }
    #webgl-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      outline: none;
    }

    /* Architectural UI Overlay */
    .glass-hud {
      background: rgba(18, 14, 11, 0.76);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(212, 160, 100, 0.16);
      border-radius: 12px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.55);
    }

    header {
      position: absolute;
      top: 22px;
      left: 24px;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 10px 18px;
      z-index: 10;
      pointer-events: auto;
    }
    .logo-mark {
      width: 38px;
      height: 38px;
      border-radius: 9px;
      background: linear-gradient(135deg, #d4902a, #632819);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 19px;
      box-shadow: 0 4px 14px rgba(212, 144, 42, 0.32);
    }
    .header-info h1 {
      font-family: 'Cinzel', serif;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 1.4px;
      color: #faf5ed;
      text-transform: uppercase;
    }
    .header-info p {
      font-size: 11px;
      color: #bfa993;
      letter-spacing: 0.6px;
    }

    /* Bottom HUD Toolbar */
    .toolbar {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 14px;
      z-index: 10;
      pointer-events: auto;
      max-width: 95vw;
      flex-wrap: wrap;
      justify-content: center;
    }

    .group-pill {
      display: flex;
      background: rgba(0, 0, 0, 0.4);
      padding: 3px;
      border-radius: 9px;
      gap: 3px;
    }

    .tool-btn {
      background: transparent;
      border: none;
      color: #d1c1af;
      padding: 7px 12px;
      border-radius: 7px;
      font-size: 11.5px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .tool-btn:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.08);
    }
    .tool-btn.active {
      color: #ffffff;
      background: linear-gradient(135deg, rgba(212, 144, 42, 0.9), rgba(99, 40, 25, 0.9));
      box-shadow: 0 4px 12px rgba(212, 144, 42, 0.25);
    }

    .sep {
      width: 1px;
      height: 20px;
      background: rgba(255, 255, 255, 0.12);
      margin: 0 2px;
    }

    .icon-action {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #dfd3c5;
      width: 34px;
      height: 34px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      transition: all 0.2s ease;
    }
    .icon-action:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #ffffff;
    }
    .icon-action.active {
      background: #d4902a;
      color: #120e0b;
    }

    /* Interactive Spec Modal */
    .spec-modal {
      position: absolute;
      top: 22px;
      right: 24px;
      width: 320px;
      padding: 18px 20px;
      z-index: 10;
      opacity: 0;
      transform: translateY(-8px) scale(0.97);
      pointer-events: none;
      transition: all 0.26s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .spec-modal.visible {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }
    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 8px;
    }
    .tag-badge {
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #d4902a;
      font-weight: 700;
      background: rgba(212, 144, 42, 0.15);
      padding: 3px 8px;
      border-radius: 20px;
    }
    .btn-close {
      background: transparent;
      border: none;
      color: #928373;
      cursor: pointer;
      font-size: 17px;
      padding: 2px 6px;
      border-radius: 6px;
    }
    .btn-close:hover {
      color: #ffffff;
    }
    .spec-modal h3 {
      font-size: 15px;
      font-weight: 700;
      color: #fbf7f0;
      margin-bottom: 6px;
      font-family: 'Cinzel', serif;
    }
    .spec-modal p {
      font-size: 11.5px;
      line-height: 1.5;
      color: #c9b9a8;
      margin-bottom: 12px;
    }
    .spec-grid {
      display: flex;
      flex-direction: column;
      gap: 5px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 10px;
    }
    .spec-item {
      display: flex;
      justify-content: space-between;
      font-size: 10.5px;
    }
    .spec-label { color: #8e7d6c; }
    .spec-val { color: #eae0d4; font-weight: 600; }

    /* Scene Loader */
    #preloader {
      position: absolute;
      inset: 0;
      background: #0b0907;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      transition: opacity 0.75s ease;
    }
    .loader-icon {
      font-size: 42px;
      margin-bottom: 14px;
      animation: gentleFloat 2.2s ease-in-out infinite;
    }
    @keyframes gentleFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-7px); }
    }
    .loader-head {
      font-family: 'Cinzel', serif;
      font-size: 18px;
      letter-spacing: 3px;
      color: #faf5ed;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .loader-desc {
      font-size: 11.5px;
      color: #a89481;
      letter-spacing: 0.8px;
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>

  <!-- Preloader Screen -->
  <div id="preloader">
    <div class="loader-icon">☕</div>
    <div class="loader-head">Artisan Coffee Bar</div>
    <div class="loader-desc">Initializing Photometric Architecture &amp; PBR Shaders...</div>
  </div>

  <!-- WebGL Viewport -->
  <canvas id="webgl-canvas"></canvas>

  <!-- Top Brand Navigation Header -->
  <header class="glass-hud">
    <div class="logo-mark">☕</div>
    <div class="header-info">
      <h1>Bunna &amp; Bloom</h1>
      <p>Artisan Slow-Bar &bull; Architectural Hospitality</p>
    </div>
  </header>

  <!-- Bottom Interactive HUD -->
  <div class="toolbar glass-hud">
    <div class="group-pill">
      <button class="tool-btn active" data-view="default">🎥 3/4 Perspective</button>
      <button class="tool-btn" data-view="espresso">☕ Espresso Hub</button>
      <button class="tool-btn" data-view="siphon">🧪 Siphon Bar</button>
      <button class="tool-btn" data-view="juice">🍹 Hydration Bar</button>
      <button class="tool-btn" data-view="lounge">🛋️ Oak Lounge</button>
    </div>

    <div class="sep"></div>

    <div class="group-pill">
      <button class="tool-btn active" data-light="daylight">☀️ 5000K Morning</button>
      <button class="tool-btn" data-light="golden">🌅 2200K Sunset</button>
      <button class="tool-btn" data-light="evening">🌙 Midnight Ambiance</button>
    </div>

    <div class="sep"></div>

    <button class="icon-action" id="audio-btn" title="Toggle Gentle Cafe Rain & Vinyl Resonance">
      🔊
    </button>
  </div>

  <!-- Interactive Equipment Inspection Modal -->
  <div class="spec-modal glass-hud" id="spec-modal">
    <div class="modal-head">
      <span class="tag-badge" id="modal-tag">Hospitality Spec</span>
      <button class="btn-close" id="btn-close">&times;</button>
    </div>
    <h3 id="modal-title">Equipment</h3>
    <p id="modal-desc">Detailed architectural description.</p>
    <div class="spec-grid" id="modal-grid"></div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

    // =========================================================================
    // 1. Procedural High-Accuracy Texture Generators
    // =========================================================================

    // Flemish-Bond Reclaimed Heritage Red-Clay Brick Texture
    function generateFlemishBrickTextures() {
      const canvas = document.createElement('canvas');
      canvas.width = 1024;
      canvas.height = 1024;
      const ctx = canvas.getContext('2d');

      const bumpCanvas = document.createElement('canvas');
      bumpCanvas.width = 1024;
      bumpCanvas.height = 1024;
      const bCtx = bumpCanvas.getContext('2d');

      // Mortar Ground Base
      ctx.fillStyle = '#6e6357';
      ctx.fillRect(0, 0, 1024, 1024);
      bCtx.fillStyle = '#2b2b2b';
      bCtx.fillRect(0, 0, 1024, 1024);

      const rows = 36;
      const rowHeight = 1024 / rows;
      const stretcherWidth = 110;
      const headerWidth = 52;
      const mortarGap = 3.5;

      const flemishPalette = [
        '#632819', '#562115', '#481c12', '#6b2d1c', 
        '#733220', '#3b170e', '#2e1a12', '#522316'
      ];

      for (let r = 0; r < rows; r++) {
        const y = r * rowHeight + mortarGap / 2;
        const h = rowHeight - mortarGap;
        let x = (r % 2 === 0) ? -stretcherWidth / 2 : 0;
        let isStretcher = (r % 2 === 0);

        while (x < 1024 + stretcherWidth) {
          const w = (isStretcher ? stretcherWidth : headerWidth) - mortarGap;
          const color = flemishPalette[Math.floor(Math.random() * flemishPalette.length)];
          
          ctx.fillStyle = color;
          ctx.fillRect(x + mortarGap / 2, y, w, h);

          // Procedural micro-chipping and weathered variations
          bCtx.fillStyle = '#dcdcdc';
          bCtx.fillRect(x + mortarGap / 2, y, w, h);

          for (let p = 0; p < 8; p++) {
            const px = x + 4 + Math.random() * (w - 8);
            const py = y + 2 + Math.random() * (h - 4);
            const sz = Math.random() * 2.5 + 0.8;
            ctx.fillStyle = Math.random() > 0.4 ? 'rgba(25, 12, 8, 0.28)' : 'rgba(215, 185, 160, 0.16)';
            ctx.fillRect(px, py, sz, sz);
          }

          x += (isStretcher ? stretcherWidth : headerWidth);
          isStretcher = !isStretcher;
        }
      }

      const diffTex = new THREE.CanvasTexture(canvas);
      diffTex.wrapS = THREE.RepeatWrapping;
      diffTex.wrapT = THREE.RepeatWrapping;
      diffTex.repeat.set(2.5, 1.8);

      const bumpTex = new THREE.CanvasTexture(bumpCanvas);
      bumpTex.wrapS = THREE.RepeatWrapping;
      bumpTex.wrapT = THREE.RepeatWrapping;
      bumpTex.repeat.set(2.5, 1.8);

      return { diffTex, bumpTex };
    }

    // 220mm Smoked French Oak Hardwood Flooring (running front-to-back in Z-direction)
    function generateSmokedOakTextures() {
      const canvas = document.createElement('canvas');
      canvas.width = 1024;
      canvas.height = 1024;
      const ctx = canvas.getContext('2d');

      // Base Smoked Oak Color (#231710)
      ctx.fillStyle = '#231710';
      ctx.fillRect(0, 0, 1024, 1024);

      const planksCount = 14;
      const plankW = 1024 / planksCount;
      const tones = ['#231710', '#2a1c13', '#1e140d', '#281a12', '#1b120c'];

      for (let i = 0; i < planksCount; i++) {
        const x = i * plankW;
        ctx.fillStyle = tones[i % tones.length];
        ctx.fillRect(x + 1.2, 0, plankW - 2.4, 1024);

        // Subtle longitudinal grain running along Z
        ctx.strokeStyle = 'rgba(10, 6, 4, 0.32)';
        ctx.lineWidth = 1;
        for (let g = 0; g < 18; g++) {
          const gx = x + Math.random() * plankW;
          ctx.beginPath();
          ctx.moveTo(gx, 0);
          ctx.bezierCurveTo(gx + (Math.random() - 0.5) * 3, 340, gx + (Math.random() - 0.5) * 3, 680, gx, 1024);
          ctx.stroke();
        }
      }

      // V-groove fine bevel seams
      ctx.strokeStyle = 'rgba(0, 0, 0, 0.65)';
      ctx.lineWidth = 2.4;
      for (let i = 0; i <= planksCount; i++) {
        ctx.beginPath();
        ctx.moveTo(i * plankW, 0);
        ctx.lineTo(i * plankW, 1024);
        ctx.stroke();
      }

      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(3, 4);
      return tex;
    }

    // End-Grain Walnut Butcher-Block Countertop Texture
    function generateWalnutCountertopTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');

      // Deep walnut tone #341e13
      ctx.fillStyle = '#341e13';
      ctx.fillRect(0, 0, 512, 512);

      // End-grain parquet bricklets
      const bw = 64;
      const bh = 32;
      const walnutShades = ['#341e13', '#3a2216', '#2d1a10', '#3f2518', '#29170e'];

      for (let y = 0; y < 512; y += bh) {
        const offset = ((y / bh) % 2 === 0) ? 0 : bw / 2;
        for (let x = -offset; x < 512 + bw; x += bw) {
          ctx.fillStyle = walnutShades[Math.floor(Math.random() * walnutShades.length)];
          ctx.fillRect(x + 1, y + 1, bw - 2, bh - 2);

          // Subtle wood ring arcs
          ctx.strokeStyle = 'rgba(255, 210, 160, 0.08)';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.arc(x + bw / 2, y + bh / 2, Math.random() * 16 + 4, 0, Math.PI);
          ctx.stroke();
        }
      }

      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(4, 1);
      return tex;
    }

    // Recessed Chalkboard Typography & Technical Siphon Anatomy
    function generateChalkboardTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 1024;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');

      // Matte charcoal slate
      ctx.fillStyle = '#171918';
      ctx.fillRect(0, 0, 1024, 512);

      // Fine chalk dust patina
      for (let i = 0; i < 35; i++) {
        ctx.fillStyle = 'rgba(255, 255, 255, 0.012)';
        ctx.beginPath();
        ctx.arc(Math.random() * 1024, Math.random() * 512, Math.random() * 100 + 40, 0, Math.PI * 2);
        ctx.fill();
      }

      // Framing double-line border
      ctx.strokeStyle = 'rgba(240, 235, 225, 0.35)';
      ctx.lineWidth = 2.5;
      ctx.strokeRect(18, 18, 1024 - 36, 512 - 36);
      ctx.strokeRect(26, 26, 1024 - 52, 512 - 52);

      // Centered Top Header
      ctx.fillStyle = '#f8f4ec';
      ctx.textAlign = 'center';
      ctx.font = 'bold 26px "Cinzel", serif, sans-serif';
      ctx.fillText('SPECIALTY COFFEE & ARTISANAL SLOW-BAR', 512, 65);

      ctx.beginPath();
      ctx.moveTo(220, 78);
      ctx.lineTo(804, 78);
      ctx.strokeStyle = 'rgba(240, 235, 225, 0.4)';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      // Left Column: Single-Origin Menu & Extraction Parameters
      ctx.textAlign = 'left';
      ctx.font = 'bold 18px "Cinzel", serif, sans-serif';
      ctx.fillStyle = '#e5a33c';
      ctx.fillText('ORIGIN RESERVE ROASTS', 56, 118);

      const origins = [
        ['Yirgacheffe G1 Washed', 'Bergamot, Jasmine, White Peach', '$5.50'],
        ['Guji Hambela Natural', 'Wild Strawberry, Dark Cocoa', '$5.75'],
        ['Sidama Bensa Anaerobic', 'Papaya Nectar, Meyer Lemon', '$6.00'],
        ['Jebena Ancestral Roast', 'Spiced Honey, Roasted Walnut', '$4.25'],
        ['Cascara Botanical Tonic', 'Sun-Dried Coffee Cherries', '$4.50']
      ];

      origins.forEach((item, idx) => {
        const py = 150 + idx * 44;
        ctx.font = 'bold 14px "Plus Jakarta Sans", sans-serif';
        ctx.fillStyle = '#f2ece4';
        ctx.fillText(item[0], 56, py);

        ctx.font = 'italic 11px "Plus Jakarta Sans", sans-serif';
        ctx.fillStyle = '#b3a291';
        ctx.fillText(item[1], 56, py + 16);

        ctx.font = 'bold 13px "Plus Jakarta Sans", sans-serif';
        ctx.fillStyle = '#e5a33c';
        ctx.textAlign = 'right';
        ctx.fillText(item[2], 375, py);
        ctx.textAlign = 'left';
      });

      // Extraction Parameters Callout
      ctx.fillStyle = 'rgba(229, 163, 60, 0.12)';
      ctx.fillRect(56, 385, 320, 68);
      ctx.strokeStyle = 'rgba(229, 163, 60, 0.35)';
      ctx.strokeRect(56, 385, 320, 68);
      ctx.fillStyle = '#e5a33c';
      ctx.font = 'bold 11px "Cinzel", serif';
      ctx.fillText('EXTRACTION BENCHMARK:', 68, 404);
      ctx.font = '11px "Plus Jakarta Sans", monospace';
      ctx.fillStyle = '#e8dfd2';
      ctx.fillText('Dose: 19.5g | Yield: 42g | Temp: 93.4°C', 68, 424);
      ctx.fillText('Pressure: 9.2 Bar | Pre-infuse: 5.5s', 68, 440);

      // Center: Delicate Technical Line Drawing of Vacuum Siphon Anatomy
      ctx.strokeStyle = '#f8f4ec';
      ctx.lineWidth = 2.2;

      // Lower Glass Flask
      ctx.beginPath();
      ctx.arc(512, 245, 42, 0, Math.PI * 2);
      ctx.stroke();

      // Lower Amber Liquid Line
      ctx.fillStyle = 'rgba(212, 130, 42, 0.32)';
      ctx.beginPath();
      ctx.arc(512, 245, 39, 0.2, Math.PI - 0.2);
      ctx.fill();

      // Upper Funnel Chamber
      ctx.strokeRect(492, 122, 40, 72);

      // Connecting Filter Tube
      ctx.beginPath();
      ctx.moveTo(512, 194);
      ctx.lineTo(512, 220);
      ctx.stroke();

      // Stand & Burner Pad
      ctx.beginPath();
      ctx.moveTo(465, 305);
      ctx.lineTo(559, 305);
      ctx.moveTo(470, 305);
      ctx.lineTo(470, 205);
      ctx.lineTo(492, 205);
      ctx.stroke();

      // Center Diagram Labels
      ctx.font = 'italic 10px "Cinzel", serif';
      ctx.fillStyle = '#d4c2af';
      ctx.textAlign = 'center';
      ctx.fillText('Vacuum Siphon Reserve', 512, 332);
      ctx.font = '9px "Plus Jakarta Sans", monospace';
      ctx.fillText('Slow Extraction 92.8°C', 512, 348);

      // Right Column: Boulangerie & Fruit Bar
      ctx.textAlign = 'left';
      ctx.font = 'bold 18px "Cinzel", serif, sans-serif';
      ctx.fillStyle = '#e5a33c';
      ctx.fillText('BOULANGERIE & CRAFT JUICE', 700, 118);

      const goods = [
        ['Normandy Butter Croissant', '84% Cultured French Butter', '$3.75'],
        ['Valrhona Pain au Chocolat', '70% Guanaja Dark Ganache', '$4.50'],
        ['Cardamom Blueberry Brioche', 'Wild Nordic Berries, Brown Sugar', '$4.25'],
        ['Raw Alphonso Mango Nectar', 'Cold-Pressed Valencia & Passionfruit', '$5.25'],
        ['Ruby Beetroot & Pomegranate', 'Organic Ginger Root, Fresh Lime', '$5.50']
      ];

      goods.forEach((item, idx) => {
        const py = 150 + idx * 44;
        ctx.font = 'bold 14px "Plus Jakarta Sans", sans-serif';
        ctx.fillStyle = '#f2ece4';
        ctx.fillText(item[0], 700, py);

        ctx.font = 'italic 11px "Plus Jakarta Sans", sans-serif';
        ctx.fillStyle = '#b3a291';
        ctx.fillText(item[1], 700, py + 16);

        ctx.font = 'bold 13px "Plus Jakarta Sans", sans-serif';
        ctx.fillStyle = '#e5a33c';
        ctx.textAlign = 'right';
        ctx.fillText(item[2], 965, py);
        ctx.textAlign = 'left';
      });

      // Bottom Inscription
      ctx.font = 'italic 12px "Cinzel", serif';
      ctx.fillStyle = '#a89481';
      ctx.textAlign = 'center';
      ctx.fillText('"Every Harvest Tells a Story, Brewed with Uncompromising Precision"', 512, 475);

      return new THREE.CanvasTexture(canvas);
    }

    // =========================================================================
    // 2. Scene, Photometric Pipeline & Renderer Setup
    // =========================================================================

    const canvas = document.getElementById('webgl-canvas');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0b0907);
    scene.fog = new THREE.FogExp2(0x130e09, 0.026);

    // Default Architectural Perspective: Eye-level (X = -2.8m, Y = 1.55m, Z = 3.2m), FOV 42°
    const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 35);
    camera.position.set(-2.8, 1.55, 3.2);

    const renderer = new THREE.WebGLRenderer({
      canvas,
      antialias: true,
      powerPreference: 'high-performance'
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.10;

    // High-Resolution Shadow Map Configuration
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    // OrbitControls
    const controls = new OrbitControls(camera, canvas);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.maxPolarAngle = Math.PI / 2 - 0.03; // Restrict clipping below floor
    controls.minDistance = 0.8;
    controls.maxDistance = 12.0;

        pos[i * 3] += steamData[i].vx;
        pos[i * 3 + 2] += steamData[i].vz;

          pos[i * 3 + 1] = steamData[i].anchor.y;

        ambientLight.color.setHex(0x261912);
        ambientLight.intensity = 0.55;
        edisonFixtures.forEach(f => f.pointLight.intensity = f.baseIntensity);
        if (bloomPass) bloomPass.strength = 0.28;
      } else if (mode === 'golden') {
        sunlight.color.setHex(0xffaa44);
        sunlight.intensity = 1.6;
        sunlight.position.set(-8.5, 3.2, 1.5);
        ambientLight.color.setHex(0x381f12);
        ambientLight.intensity = 0.45;
        edisonFixtures.forEach(f => f.pointLight.intensity = f.baseIntensity * 1.35);
        if (bloomPass) bloomPass.strength = 0.42;
      } else if (mode === 'evening') {
        sunlight.color.setHex(0x1a2638);
        sunlight.intensity = 0.35;
        ambientLight.color.setHex(0x18100a);
        ambientLight.intensity = 0.28;
        edisonFixtures.forEach(f => f.pointLight.intensity = f.baseIntensity * 1.8);
        if (bloomPass) bloomPass.strength = 0.65;
      }
    }

    // =========================================================================
    // 10. Procedural Ambient Rain & Vinyl Resonance Audio
    // =========================================================================

    let audioContext = null;
    let isSoundOn = false;
    let masterGain = null;

    function startProceduralAudio() {
      if (audioContext) return;
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      audioContext = new AudioCtx();

      const bufferSize = audioContext.sampleRate * 2;
      const noiseBuffer = audioContext.createBuffer(1, bufferSize, audioContext.sampleRate);
      const out = noiseBuffer.getChannelData(0);
      let b0 = 0, b1 = 0, b2 = 0;
      for (let i = 0; i < bufferSize; i++) {
        const white = Math.random() * 2 - 1;
        b0 = 0.99886 * b0 + white * 0.0555179;
        b1 = 0.99332 * b1 + white * 0.0750759;
        b2 = 0.96900 * b2 + white * 0.1538520;
        out[i] = (b0 + b1 + b2) * 0.06;
      }

      const whiteSrc = audioContext.createBufferSource();
      whiteSrc.buffer = noiseBuffer;
      whiteSrc.loop = true;

      const lowpass = audioContext.createBiquadFilter();
      lowpass.type = 'lowpass';
      lowpass.frequency.setValueAtTime(540, audioContext.currentTime);

      masterGain = audioContext.createGain();
      masterGain.gain.setValueAtTime(0, audioContext.currentTime);

      whiteSrc.connect(lowpass);
      lowpass.connect(masterGain);
      masterGain.connect(audioContext.destination);
      whiteSrc.start();
    }

    function toggleSound() {
      startProceduralAudio();
      if (audioContext.state === 'suspended') audioContext.resume();
      isSoundOn = !isSoundOn;
      const btn = document.getElementById('audio-btn');
      if (isSoundOn) {
        masterGain.gain.setTargetAtTime(0.22, audioContext.currentTime, 0.4);
        btn.classList.add('active');
        btn.innerHTML = '🔊';
      } else {
        masterGain.gain.setTargetAtTime(0, audioContext.currentTime, 0.4);
        btn.classList.remove('active');
        btn.innerHTML = '🔇';
      }
    }

    // =========================================================================
    // 11. Raycasting & Interactive Modal Inspections
    // =========================================================================

    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    const modal = document.getElementById('spec-modal');
    const modalTitle = document.getElementById('modal-title');
    const modalTag = document.getElementById('modal-tag');
    const modalDesc = document.getElementById('modal-desc');
    const modalGrid = document.getElementById('modal-grid');

    function onPointerDown(event) {
      if (event.target.closest('.glass-hud')) return;
      pointer.x = (event.clientX / window.innerWidth) * 2 - 1;
      pointer.y = -(event.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(pointer, camera);
      const hits = raycaster.intersectObjects(interactiveObjects, false);

      if (hits.length > 0) {
        const d = hits[0].object.userData;
        if (d && d.title) {
          modalTitle.textContent = d.title;
          modalTag.textContent = d.tag || "Boutique Hospitality";
          modalDesc.textContent = d.desc;
          modalGrid.innerHTML = '';
          if (d.specs) {
            d.specs.forEach(([lbl, val]) => {
              const row = document.createElement('div');
              row.className = 'spec-item';
              row.innerHTML = `<span class="spec-label">${lbl}</span><span class="spec-val">${val}</span>`;
              modalGrid.appendChild(row);
            });
          }
          modal.classList.add('visible');
        }
      }
    }

    document.getElementById('btn-close').addEventListener('click', () => {
      modal.classList.remove('visible');
    });
    window.addEventListener('pointerdown', onPointerDown);

    // Button Bindings
    document.querySelectorAll('[data-view]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('[data-view]').forEach(b => b.classList.remove('active'));
        e.currentTarget.classList.add('active');
        activateView(e.currentTarget.dataset.view);
      });
    });

    document.querySelectorAll('[data-light]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('[data-light]').forEach(b => b.classList.remove('active'));
        e.currentTarget.classList.add('active');
        setLightingMode(e.currentTarget.dataset.light);
      });
    });

    document.getElementById('audio-btn').addEventListener('click', toggleSound);

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      if (composer) composer.setSize(window.innerWidth, window.innerHeight);
    });

    setTimeout(() => {
      const loader = document.getElementById('preloader');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(() => loader.remove(), 750);
      }
    }, 550);

    // =========================================================================
    // 12. Main Architectural Render Loop
    // =========================================================================

    const clock = new THREE.Clock();

    function renderLoop() {
      requestAnimationFrame(renderLoop);
      const elapsed = clock.getElapsedTime();

      // Camera Lerp
      if (isMovingCam) {
        camera.position.lerp(targetCam, 0.05);
        controls.target.lerp(targetTarget, 0.05);
        if (camera.position.distanceTo(targetCam) < 0.03 && controls.target.distanceTo(targetTarget) < 0.03) {
          camera.position.copy(targetCam);
          controls.target.copy(targetTarget);
          isMovingCam = false;
        }
      }

      controls.update();

      // Delicate filament pulse
      edisonFixtures.forEach((f, i) => {
        f.pointLight.intensity = f.baseIntensity + Math.sin(elapsed * 4 + i) * 0.04;
      });

      // Steam Particle Simulation
      updateSteamSimulation();

      // Render
      if (composer) {
        composer.render();
      } else {
        renderer.render(scene, camera);
      }
    }

    renderLoop();
  </script>
</body>
