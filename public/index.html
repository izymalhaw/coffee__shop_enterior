<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Boutique Artisan Coffee Bar | 3D Architectural Experience</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0b0907;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      color: #f7eedf;
    }
    #webgl-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      outline: none;
    }

    /* Architectural UI Overlay */
    .glass-hud {
      background: rgba(18, 14, 11, 0.76);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(212, 160, 100, 0.16);
      border-radius: 12px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.55);
    }

    header {
      position: absolute;
      top: 22px;
      left: 24px;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 10px 18px;
      z-index: 10;
      pointer-events: auto;
    }
    .logo-mark {
      width: 38px;
      height: 38px;
      border-radius: 9px;
      background: linear-gradient(135deg, #d4902a, #632819);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 19px;
      box-shadow: 0 4px 14px rgba(212, 144, 42, 0.32);
    }
    .header-info h1 {
      font-family: 'Cinzel', serif;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 1.4px;
      color: #faf5ed;
      text-transform: uppercase;
    }
    .header-info p {
      font-size: 11px;
      color: #bfa993;
      letter-spacing: 0.6px;
    }

    /* Bottom HUD Toolbar */
    .toolbar {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 14px;
      z-index: 10;
      pointer-events: auto;
      max-width: 95vw;
      flex-wrap: wrap;
      justify-content: center;
    }

    .group-pill {
      display: flex;
      background: rgba(0, 0, 0, 0.4);
      padding: 3px;
      border-radius: 9px;
      gap: 3px;
    }

    .tool-btn {
      background: transparent;
      border: none;
      color: #d1c1af;
      padding: 7px 12px;
      border-radius: 7px;
      font-size: 11.5px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .tool-btn:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.08);
    }
    .tool-btn.active {
      color: #ffffff;
      background: linear-gradient(135deg, rgba(212, 144, 42, 0.9), rgba(99, 40, 25, 0.9));
      box-shadow: 0 4px 12px rgba(212, 144, 42, 0.25);
    }

    .sep {
      width: 1px;
      height: 20px;
      background: rgba(255, 255, 255, 0.12);
      margin: 0 2px;
    }

    .icon-action {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #dfd3c5;
      width: 34px;
      height: 34px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      transition: all 0.2s ease;
    }
    .icon-action:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #ffffff;
    }
    .icon-action.active {
      background: #d4902a;
      color: #120e0b;
    }

    /* Interactive Spec Modal (repositioned to bottom-right to avoid drawer collision) */
    .spec-modal {
      position: absolute;
      bottom: 84px;
      right: 24px;
      width: 320px;
      padding: 18px 20px;
      z-index: 15;
      opacity: 0;
      transform: translateY(8px) scale(0.97);
      pointer-events: none;
      transition: all 0.26s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .spec-modal.visible {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }
    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 8px;
    }
    .tag-badge {
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #d4902a;
      font-weight: 700;
      background: rgba(212, 144, 42, 0.15);
      padding: 3px 8px;
      border-radius: 20px;
    }
    .btn-close {
      background: transparent;
      border: none;
      color: #928373;
      cursor: pointer;
      font-size: 19px;
      padding: 4px 8px;
      border-radius: 6px;
      min-width: 32px;
      min-height: 32px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .btn-close:hover {
      color: #ffffff;
    }
    .spec-modal h3 {
      font-size: 15px;
      font-weight: 700;
      color: #fbf7f0;
      margin-bottom: 6px;
      font-family: 'Cinzel', serif;
    }
    .spec-modal p {
      font-size: 11.5px;
      line-height: 1.5;
      color: #c9b9a8;
      margin-bottom: 12px;
    }
    .spec-grid {
      display: flex;
      flex-direction: column;
      gap: 5px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 10px;
    }
    .spec-item {
      display: flex;
      justify-content: space-between;
      font-size: 10.5px;
    }
    .spec-label { color: #8e7d6c; }
    .spec-val { color: #eae0d4; font-weight: 600; }

    /* Layers Toggle Button (Touch Target >= 44px) */
    .layers-toggle-btn {
      position: absolute;
      top: 22px;
      right: 24px;
      min-width: 44px;
      min-height: 44px;
      padding: 10px 16px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      color: #f7eedf;
      cursor: pointer;
      z-index: 20;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .layers-toggle-btn:hover, .layers-toggle-btn.active {
      background: rgba(35, 28, 22, 0.92);
      border-color: rgba(212, 144, 42, 0.6);
      color: #ffffff;
      box-shadow: 0 4px 18px rgba(212, 144, 42, 0.28);
    }
    .gear-icon {
      font-size: 16px;
      transition: transform 0.3s ease;
    }
    .layers-toggle-btn.active .gear-icon {
      transform: rotate(60deg);
    }

    /* Collapsible Frosted-Glass Layers Drawer */
    .layers-drawer {
      position: absolute;
      top: 76px;
      right: 24px;
      width: 295px;
      max-width: calc(100vw - 48px);
      background: rgba(20, 20, 20, 0.75);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(212, 160, 100, 0.22);
      border-radius: 12px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.65);
      padding: 16px 18px;
      z-index: 20;
      opacity: 0;
      pointer-events: none;
      transform: translateY(-10px) scale(0.96);
      transition: all 0.24s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .layers-drawer.open {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0) scale(1);
    }
    .layers-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.10);
    }
    .layers-title-row {
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .layers-title-icon {
      font-size: 15px;
    }
    .layers-head h3 {
      font-family: 'Cinzel', serif;
      font-size: 13px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #faf5ed;
    }
    .layers-list {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .layer-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 44px;
      padding: 4px 6px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    .layer-item:hover {
      background: rgba(255, 255, 255, 0.05);
    }
    .layer-info {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 12px;
      font-weight: 500;
      color: #e8ded2;
    }
    .layer-icon {
      font-size: 15px;
      width: 20px;
      text-align: center;
    }
    .layer-text {
      letter-spacing: 0.2px;
    }

    /* iOS-Style Toggle Switch (Tap Target >= 44px) */
    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
      min-width: 44px;
      min-height: 24px;
      flex-shrink: 0;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background-color: rgba(255, 255, 255, 0.16);
      border-radius: 24px;
      transition: 0.24s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: #ffffff;
      border-radius: 50%;
      transition: 0.24s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.35);
    }
    input:checked + .slider {
      background-color: #d4902a;
    }
    input:checked + .slider:before {
      transform: translateX(20px);
    }

    /* Mobile Responsive Optimizations */
    @media (max-width: 768px) {
      header {
        top: 12px;
        left: 12px;
        padding: 7px 12px;
        gap: 9px;
        max-width: calc(100vw - 120px);
        overflow: hidden;
      }
      .logo-mark {
        width: 32px;
        height: 32px;
        font-size: 16px;
        flex-shrink: 0;
      }
      .header-info {
        min-width: 0;
        overflow: hidden;
      }
      .header-info h1 {
        font-size: 12.5px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .header-info p {
        display: none;
      }
      .layers-toggle-btn {
        top: 12px;
        right: 12px;
        min-height: 44px;
        min-width: 44px;
        padding: 8px 12px;
        z-index: 25;
      }
      .layers-drawer {
        top: 64px;
        right: 12px;
        left: 12px;
        width: auto;
        max-width: none;
      }
      .toolbar {
        bottom: 12px;
        padding: 5px 8px;
        gap: 6px;
        max-width: 98vw;
      }
      .tool-btn {
        min-height: 44px;
        padding: 8px 10px;
        font-size: 11px;
      }
      .icon-action {
        width: 44px;
        height: 44px;
        font-size: 16px;
      }
      .spec-modal {
        bottom: 76px;
        left: 12px;
        right: 12px;
        width: auto;
        max-width: none;
      }
    }

    /* Scene Loader */
    #preloader {
      position: absolute;
      inset: 0;
      background: #0b0907;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      transition: opacity 0.75s ease;
    }
    .loader-icon {
      font-size: 42px;
      margin-bottom: 14px;
      animation: gentleFloat 2.2s ease-in-out infinite;
    }
    @keyframes gentleFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-7px); }
    }
    .loader-head {
      font-family: 'Cinzel', serif;
      font-size: 18px;
      letter-spacing: 3px;
      color: #faf5ed;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .loader-desc {
      font-size: 11.5px;
      color: #a89481;
      letter-spacing: 0.8px;
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>

  <!-- Preloader Screen -->
  <div id="preloader">
    <div class="loader-icon">☕</div>
    <div class="loader-head">Artisan Coffee Bar</div>
    <div class="loader-desc">Initializing Photometric Architecture &amp; PBR Shaders...</div>
  </div>

  <!-- WebGL Viewport -->
  <canvas id="webgl-canvas"></canvas>

  <!-- Top Brand Navigation Header -->
  <header class="glass-hud">
    <div class="logo-mark">☕</div>
    <div class="header-info">
      <h1>Bunna &amp; Bloom</h1>
      <p>Artisan Slow-Bar &bull; Architectural Hospitality</p>
    </div>
  </header>
 
   <!-- Layers Toggle Button -->
   <button id="layers-toggle-btn" class="layers-toggle-btn glass-hud" title="Toggle Scene Layers" aria-label="Toggle Scene Layers">
     <span class="gear-icon">⚙</span>
     <span class="layers-btn-label">Layers</span>
   </button>
 
   <!-- Collapsible Frosted-Glass Layers Drawer -->
   <div id="layers-drawer" class="layers-drawer glass-hud" role="region" aria-label="Scene Layer Controls">
     <div class="layers-head">
       <div class="layers-title-row">
         <span class="layers-title-icon">🗂</span>
         <h3>Scene Layers</h3>
       </div>
       <button id="layers-close-btn" class="btn-close" aria-label="Close Layers Drawer">&times;</button>
     </div>
     <div class="layers-list">
       <label class="layer-item" for="toggle-customers">
         <div class="layer-info">
           <span class="layer-icon">👥</span>
           <span class="layer-text">Customers &amp; Characters</span>
         </div>
         <div class="switch">
           <input type="checkbox" id="toggle-customers" checked>
           <span class="slider"></span>
         </div>

       <label class="layer-item" for="toggle-siphon">

         <div class="switch">
           <input type="checkbox" id="toggle-siphon" checked>

       <label class="layer-item" for="toggle-espresso">
         <div class="layer-info">
           <span class="layer-icon">☕</span>

         </div>
         <div class="switch">
           <input type="checkbox" id="toggle-espresso" checked>

         </div>

       <label class="layer-item" for="toggle-dispensers">
         <div class="layer-info">
           <span class="layer-info-inner" style="display:flex;align-items:center;gap:9px;">
             <span class="layer-icon">🍹</span>
             <span class="layer-text">Juice Dispensers &amp; Fruit</span>
           </span>
         </div>
         <div class="switch">
           <input type="checkbox" id="toggle-dispensers" checked>
           <span class="slider"></span>
         </div>
       </label>
 
       <label class="layer-item" for="toggle-lighting">
         <div class="layer-info">
           <span class="layer-icon">💡</span>
           <span class="layer-text">Pendant Lighting Rig</span>
         </div>
         <div class="switch">
           <input type="checkbox" id="toggle-lighting" checked>
           <span class="slider"></span>
         </div>
       </label>
 
       <label class="layer-item" for="toggle-chalkboards">
         <div class="layer-info">
           <span class="layer-info-inner" style="display:flex;align-items:center;gap:9px;">
             <span class="layer-icon">📋</span>
             <span class="layer-text">Chalkboards (Main &amp; Sign)</span>
           </span>
         </div>
         <div class="switch">
           <input type="checkbox" id="toggle-chalkboards" checked>
           <span class="slider"></span>
         </div>
       </label>
     </div>
   </div>
 
   <!-- Bottom Interactive HUD -->
   <div class="toolbar glass-hud">
     <div class="group-pill">
       <button class="tool-btn active" data-view="default">🎥 3/4 Perspective</button>
       <button class="tool-btn" data-view="sunset">☀️ Casement Window</button>
       <button class="tool-btn" data-view="mojito">🍸 Mojito Table</button>
       <button class="tool-btn" data-view="espresso">☕ Barista Hub</button>
       <button class="tool-btn" data-view="siphon">🧪 Siphon Bar</button>
       <button class="tool-btn" data-view="entrance">🚪 Entrance Sign</button>
     </div>

    <div class="sep"></div>

    <div class="group-pill">
      <button class="tool-btn active" data-light="golden">🌅 Golden Sunset</button>
      <button class="tool-btn" data-light="daylight">☀️ 5000K Morning</button>
      <button class="tool-btn" data-light="evening">🌙 Midnight Ambiance</button>
    </div>

    <div class="sep"></div>

    <button class="icon-action" id="audio-btn" title="Toggle Gentle Cafe Rain & Vinyl Resonance">
      🔊
    </button>
  </div>

  <!-- Interactive Equipment Inspection Modal -->
  <div class="spec-modal glass-hud" id="spec-modal">
    <div class="modal-head">
      <span class="tag-badge" id="modal-tag">Hospitality Spec</span>
      <button class="btn-close" id="btn-close">&times;</button>
    </div>
    <h3 id="modal-title">Equipment</h3>
    <p id="modal-desc">Detailed architectural description.</p>
    <div class="spec-grid" id="modal-grid"></div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

    // =========================================================================
    // 1. Procedural High-Accuracy Texture Generators
    // =========================================================================

    // Flemish-Bond Reclaimed Heritage Red-Clay Brick Texture
    function generateFlemishBrickTextures() {
      const canvas = document.createElement('canvas');
      canvas.width = 1024;
      canvas.height = 1024;
      const ctx = canvas.getContext('2d');

      const bumpCanvas = document.createElement('canvas');
      bumpCanvas.width = 1024;
      bumpCanvas.height = 1024;
      const bCtx = bumpCanvas.getContext('2d');

      // Mortar Ground Base
      ctx.fillStyle = '#6e6357';
      ctx.fillRect(0, 0, 1024, 1024);
      bCtx.fillStyle = '#2b2b2b';
      bCtx.fillRect(0, 0, 1024, 1024);

      const rows = 36;
      const rowHeight = 1024 / rows;
      const stretcherWidth = 110;
      const headerWidth = 52;
      const mortarGap = 3.5;

      const flemishPalette = [
        '#632819', '#562115', '#481c12', '#6b2d1c', 
        '#733220', '#3b170e', '#2e1a12', '#522316'
      ];

      for (let r = 0; r < rows; r++) {
        const y = r * rowHeight + mortarGap / 2;
        const h = rowHeight - mortarGap;
        let x = (r % 2 === 0) ? -stretcherWidth / 2 : 0;
        let isStretcher = (r % 2 === 0);

        while (x < 1024 + stretcherWidth) {
          const w = (isStretcher ? stretcherWidth : headerWidth) - mortarGap;
          const color = flemishPalette[Math.floor(Math.random() * flemishPalette.length)];
          
          ctx.fillStyle = color;
          ctx.fillRect(x + mortarGap / 2, y, w, h);

          // Procedural micro-chipping and weathered variations
          bCtx.fillStyle = '#dcdcdc';
          bCtx.fillRect(x + mortarGap / 2, y, w, h);

          for (let p = 0; p < 8; p++) {
            const px = x + 4 + Math.random() * (w - 8);
            const py = y + 2 + Math.random() * (h - 4);
            const sz = Math.random() * 2.5 + 0.8;
            ctx.fillStyle = Math.random() > 0.4 ? 'rgba(25, 12, 8, 0.28)' : 'rgba(215, 185, 160, 0.16)';
            ctx.fillRect(px, py, sz, sz);
          }

          x += (isStretcher ? stretcherWidth : headerWidth);
          isStretcher = !isStretcher;
        }
      }

      const diffTex = new THREE.CanvasTexture(canvas);
      diffTex.wrapS = THREE.RepeatWrapping;
      diffTex.wrapT = THREE.RepeatWrapping;
      diffTex.repeat.set(2.5, 1.8);

      const bumpTex = new THREE.CanvasTexture(bumpCanvas);
      bumpTex.wrapS = THREE.RepeatWrapping;
      bumpTex.wrapT = THREE.RepeatWrapping;
      bumpTex.repeat.set(2.5, 1.8);

      return { diffTex, bumpTex };
    }

    // 220mm Smoked French Oak Hardwood Flooring (running front-to-back in Z-direction)
    function generateSmokedOakTextures() {
      const canvas = document.createElement('canvas');
      canvas.width = 1024;
      canvas.height = 1024;
      const ctx = canvas.getContext('2d');

      // Base Smoked Oak Color (#231710)
      ctx.fillStyle = '#231710';
      ctx.fillRect(0, 0, 1024, 1024);

      const planksCount = 14;
      const plankW = 1024 / planksCount;
      const tones = ['#231710', '#2a1c13', '#1e140d', '#281a12', '#1b120c'];

      for (let i = 0; i < planksCount; i++) {
        const x = i * plankW;
        ctx.fillStyle = tones[i % tones.length];
        ctx.fillRect(x + 1.2, 0, plankW - 2.4, 1024);

        // Subtle longitudinal grain running along Z
        ctx.strokeStyle = 'rgba(10, 6, 4, 0.32)';
        ctx.lineWidth = 1;
        for (let g = 0; g < 18; g++) {
          const gx = x + Math.random() * plankW;
          ctx.beginPath();
          ctx.moveTo(gx, 0);
          ctx.bezierCurveTo(gx + (Math.random() - 0.5) * 3, 340, gx + (Math.random() - 0.5) * 3, 680, gx, 1024);
          ctx.stroke();
        }
      }

    // Circular Pressure Gauge Face (45mm dial with green extraction and red overpressure arcs, tick marks, needle)
    function generateSoniferPressureGaugeTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 256;
      canvas.height = 256;
      const ctx = canvas.getContext('2d');

      // White/cream dial faceplate
      ctx.fillStyle = '#f8f7f4';
      ctx.beginPath();
      ctx.arc(128, 128, 126, 0, Math.PI * 2);
      ctx.fill();

      // Outer bezel trim
      ctx.strokeStyle = '#222222';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(128, 128, 124, 0, Math.PI * 2);
      ctx.stroke();

      const startAngle = 0.75 * Math.PI;
      const totalSpan = 1.5 * Math.PI;

      // Green Extraction Pressure Arc (8 to 12 Bar)
      ctx.strokeStyle = '#2e7d32';
      ctx.lineWidth = 10;
      ctx.beginPath();
      ctx.arc(128, 128, 100, startAngle + totalSpan * (8 / 16), startAngle + totalSpan * (12 / 16));
      ctx.stroke();

      // Red Over-Pressure Arc (12 to 16 Bar)
      ctx.strokeStyle = '#c62828';
      ctx.lineWidth = 10;
      ctx.beginPath();
      ctx.arc(128, 128, 100, startAngle + totalSpan * (12 / 16), startAngle + totalSpan);
      ctx.stroke();

      // 0-16 Bar Calibration Tick Marks
      for (let i = 0; i <= 16; i++) {
        const angle = startAngle + totalSpan * (i / 16);
        const rInner = i % 4 === 0 ? 84 : 92;
        const rOuter = 108;
        ctx.strokeStyle = '#1a1a1a';
        ctx.lineWidth = i % 4 === 0 ? 3 : 1.5;
        ctx.beginPath();
        ctx.moveTo(128 + Math.cos(angle) * rInner, 128 + Math.sin(angle) * rInner);
        ctx.lineTo(128 + Math.cos(angle) * rOuter, 128 + Math.sin(angle) * rOuter);
        ctx.stroke();
      }

      // Barometer Typography
      ctx.fillStyle = '#1a1a1a';
      ctx.font = 'bold 18px "Plus Jakarta Sans", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('BAR', 128, 172);
      ctx.font = 'bold 9px "Plus Jakarta Sans", sans-serif';
      ctx.fillStyle = '#555555';
      ctx.fillText('EXTRACTION', 128, 186);

      // Black Indicator Needle (Pivoted at ~9.2 Bar optimal delivery)
      const needleAngle = startAngle + totalSpan * (9.2 / 16);
      ctx.strokeStyle = '#111111';
      ctx.lineWidth = 3.5;
      ctx.beginPath();
      ctx.moveTo(128 - Math.cos(needleAngle) * 16, 128 - Math.sin(needleAngle) * 16);
      ctx.lineTo(128 + Math.cos(needleAngle) * 88, 128 + Math.sin(needleAngle) * 88);
      ctx.stroke();

      // Center pivot cap
      ctx.fillStyle = '#111111';
      ctx.beginPath();
      ctx.arc(128, 128, 9, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#c0c0c0';
      ctx.beginPath();
      ctx.arc(128, 128, 4, 0, Math.PI * 2);
      ctx.fill();

      return new THREE.CanvasTexture(canvas);
    }

      const anchor = emitterAnchors[i % emitterAnchors.length];
      steamPos[i * 3] = anchor.x + (Math.random() - 0.5) * 0.03;
      steamPos[i * 3 + 1] = anchor.y + Math.random() * 0.25;
      steamPos[i * 3 + 2] = anchor.z + (Math.random() - 0.5) * 0.03;
      steamData.push({
        anchor,
        vy: 0.003 + Math.random() * 0.005,
        vx: (Math.random() - 0.5) * 0.0015,
        vz: (Math.random() - 0.5) * 0.0015
      });
    }
    steamGeo.setAttribute('position', new THREE.BufferAttribute(steamPos, 3));

    const sCanvas = document.createElement('canvas');
    sCanvas.width = 32;
    sCanvas.height = 32;
    const sCtx = sCanvas.getContext('2d');
    const sGrad = sCtx.createRadialGradient(16, 16, 0, 16, 16, 16);
    sGrad.addColorStop(0, 'rgba(255, 255, 255, 0.35)');
    sGrad.addColorStop(0.5, 'rgba(255, 255, 255, 0.12)');
    sGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');
    sCtx.fillStyle = sGrad;
    sCtx.fillRect(0, 0, 32, 32);

    const steamMat = new THREE.PointsMaterial({
      size: 0.16,
      map: new THREE.CanvasTexture(sCanvas),
      transparent: true,
      opacity: 0.32,
      depthWrite: false,
      blending: THREE.AdditiveBlending
    });
    const steamParticles = new THREE.Points(steamGeo, steamMat);
    scene.add(steamParticles);

    function updateSteamSimulation() {
      const pos = steamParticles.geometry.attributes.position.array;
      for (let i = 0; i < steamCount; i++) {
        pos[i * 3 + 1] += steamData[i].vy;
        pos[i * 3] += steamData[i].vx;
        pos[i * 3 + 2] += steamData[i].vz;
        if (pos[i * 3 + 1] > steamData[i].anchor.y + 0.40) {
          pos[i * 3] = steamData[i].anchor.x + (Math.random() - 0.5) * 0.03;
          pos[i * 3 + 1] = steamData[i].anchor.y;
          pos[i * 3 + 2] = steamData[i].anchor.z + (Math.random() - 0.5) * 0.03;
        }
      }
      steamParticles.geometry.attributes.position.needsUpdate = true;
    }

      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      audioContext = new AudioCtx();

      const bufferSize = audioContext.sampleRate * 2;
      const noiseBuffer = audioContext.createBuffer(1, bufferSize, audioContext.sampleRate);
      const out = noiseBuffer.getChannelData(0);
      let b0 = 0, b1 = 0, b2 = 0;
      for (let i = 0; i < bufferSize; i++) {
        const white = Math.random() * 2 - 1;
        b0 = 0.99886 * b0 + white * 0.0555179;
        b1 = 0.99332 * b1 + white * 0.0750759;
        b2 = 0.96900 * b2 + white * 0.1538520;
        out[i] = (b0 + b1 + b2) * 0.06;
      }

      const whiteSrc = audioContext.createBufferSource();
      whiteSrc.buffer = noiseBuffer;
      whiteSrc.loop = true;

      const lowpass = audioContext.createBiquadFilter();
      lowpass.type = 'lowpass';
      lowpass.frequency.setValueAtTime(540, audioContext.currentTime);

      masterGain = audioContext.createGain();
      masterGain.gain.setValueAtTime(0, audioContext.currentTime);

      whiteSrc.connect(lowpass);
      lowpass.connect(masterGain);
      masterGain.connect(audioContext.destination);
      whiteSrc.start();
    }

    function toggleSound() {
      startProceduralAudio();
      if (audioContext.state === 'suspended') audioContext.resume();
      isSoundOn = !isSoundOn;
      const btn = document.getElementById('audio-btn');
      if (isSoundOn) {
        masterGain.gain.setTargetAtTime(0.22, audioContext.currentTime, 0.4);
        btn.classList.add('active');
        btn.innerHTML = '🔊';
      } else {
        masterGain.gain.setTargetAtTime(0, audioContext.currentTime, 0.4);
        btn.classList.remove('active');
        btn.innerHTML = '🔇';
      }
    }

    // =========================================================================
    // 11. Raycasting & Interactive Modal Inspections
    // =========================================================================

    function isAncestorVisible(obj) {
      let curr = obj;
      while (curr) {
        if (!curr.visible) return false;
        curr = curr.parent;
      }
      return true;
    }

    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    const modal = document.getElementById('spec-modal');
    const modalTitle = document.getElementById('modal-title');
    const modalTag = document.getElementById('modal-tag');
    const modalDesc = document.getElementById('modal-desc');
    const modalGrid = document.getElementById('modal-grid');

    function onPointerDown(event) {
      if (event.target.closest('.glass-hud')) return;
      pointer.x = (event.clientX / window.innerWidth) * 2 - 1;
      pointer.y = -(event.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(pointer, camera);
      const activeTargets = interactiveObjects.filter(isAncestorVisible);
      const hits = raycaster.intersectObjects(activeTargets, false);

      if (hits.length > 0) {
        const d = hits[0].object.userData;
        if (d && d.title) {
          modalTitle.textContent = d.title;
          modalTag.textContent = d.tag || "Boutique Hospitality";
          modalDesc.textContent = d.desc;
          modalGrid.innerHTML = '';
          if (d.specs) {
            d.specs.forEach(([lbl, val]) => {
              const row = document.createElement('div');
              row.className = 'spec-item';
              row.innerHTML = `<span class="spec-label">${lbl}</span><span class="spec-val">${val}</span>`;
              modalGrid.appendChild(row);
            });
          }
          modal.classList.add('visible');
        }
      }
    }

    document.getElementById('btn-close').addEventListener('click', () => {
      modal.classList.remove('visible');
    });
    window.addEventListener('pointerdown', onPointerDown);

    // Camera Preset Buttons
    document.querySelectorAll('[data-view]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('[data-view]').forEach(b => b.classList.remove('active'));
        e.currentTarget.classList.add('active');
        activateView(e.currentTarget.dataset.view);
      });
    });

    // Lighting Preset Buttons
    document.querySelectorAll('[data-light]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('[data-light]').forEach(b => b.classList.remove('active'));
        e.currentTarget.classList.add('active');
        setLightingMode(e.currentTarget.dataset.light);
      });
    });

    document.getElementById('audio-btn').addEventListener('click', toggleSound);

    // =========================================================================
    // Discrete Scene Group Visibility Switches & Layers Drawer Handling
    // =========================================================================

    const layerToggles = {
      'toggle-customers': customersGroup,
      'toggle-siphon': siphonGroup,
      'toggle-espresso': espressoGroup,
      'toggle-dispensers': dispenserGroup,
      'toggle-lighting': lightingRigGroup,
      'toggle-chalkboards': chalkboardsGroup
    };

    Object.entries(layerToggles).forEach(([id, grp]) => {
      const el = document.getElementById(id);
      if (el && grp) {
        el.addEventListener('change', (e) => {
          grp.visible = e.target.checked;
        });
      }
    });

    // Mobile HUD: Collapsible Layers Drawer Open/Close
    const layersBtn = document.getElementById('layers-toggle-btn');
    const layersDrawer = document.getElementById('layers-drawer');
    const layersCloseBtn = document.getElementById('layers-close-btn');

    if (layersBtn && layersDrawer) {
      layersBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        const isOpen = layersDrawer.classList.toggle('open');
        layersBtn.classList.toggle('active', isOpen);
      });
    }
    if (layersCloseBtn && layersDrawer) {
      layersCloseBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        layersDrawer.classList.remove('open');
        if (layersBtn) layersBtn.classList.remove('active');
      });
    }
    document.addEventListener('pointerdown', (e) => {
      if (layersDrawer && layersDrawer.classList.contains('open')) {
        if (!layersDrawer.contains(e.target) && !layersBtn.contains(e.target)) {
          layersDrawer.classList.remove('open');
          if (layersBtn) layersBtn.classList.remove('active');
        }
      }
    });

    // Responsive Viewport Resize & Dynamic Frustum
    window.addEventListener('resize', () => {
      updateCameraFrustum();
      renderer.setSize(window.innerWidth, window.innerHeight);
      if (composer) composer.setSize(window.innerWidth, window.innerHeight);
    });

    setTimeout(() => {
      const loader = document.getElementById('preloader');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(() => loader.remove(), 750);
      }
    }, 550);

    // =========================================================================
    // 12. Main Architectural Render Loop
    // =========================================================================

    const clock = new THREE.Clock();

    function renderLoop() {
      requestAnimationFrame(renderLoop);
      const elapsed = clock.getElapsedTime();

      // Camera Lerp
      if (isMovingCam) {
        camera.position.lerp(targetCam, 0.05);
        controls.target.lerp(targetTarget, 0.05);
        if (camera.position.distanceTo(targetCam) < 0.03 && controls.target.distanceTo(targetTarget) < 0.03) {
          camera.position.copy(targetCam);
          controls.target.copy(targetTarget);
          isMovingCam = false;
        }
      }

      controls.update();

      // Delicate filament pulse on active point lights
      edisonFixtures.forEach((f, i) => {
        if (f.pointLight && f.baseIntensity > 0) {
          f.pointLight.intensity = f.baseIntensity + Math.sin(elapsed * 4 + i) * 0.04;
        }
      });

      // Steam Particle Simulation (synchronized with equipment layer visibility)
      if (siphonGroup.visible || espressoGroup.visible) {
        steamParticles.visible = true;
        updateSteamSimulation();
      } else {
        steamParticles.visible = false;
      }

      // Render Scene
      if (composer) {
        composer.render();
      } else {
        renderer.render(scene, camera);
      }
    }

    renderLoop();
  </script>
</body>
</html>
