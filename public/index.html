<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Boutique Artisan Coffee Bar | 3D Architectural Experience</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0b0907;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      color: #f7eedf;
    }
    #webgl-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      outline: none;
    }

    /* Architectural UI Overlay */
    .glass-hud {
      background: rgba(18, 14, 11, 0.76);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(212, 160, 100, 0.16);
      border-radius: 12px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.55);
    }

    header {
      position: absolute;
      top: 22px;
      left: 24px;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 10px 18px;
      z-index: 10;
      pointer-events: auto;
    }
    .logo-mark {
      width: 38px;
      height: 38px;
      border-radius: 9px;
      background: linear-gradient(135deg, #d4902a, #632819);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 19px;
      box-shadow: 0 4px 14px rgba(212, 144, 42, 0.32);
    }
    .header-info h1 {
      font-family: 'Cinzel', serif;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 1.4px;
      color: #faf5ed;
      text-transform: uppercase;
    }
    .header-info p {
      font-size: 11px;
      color: #bfa993;
      letter-spacing: 0.6px;
    }

    /* Bottom HUD Toolbar */
    .toolbar {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 14px;
      z-index: 10;
      pointer-events: auto;
      max-width: 95vw;
      flex-wrap: wrap;
      justify-content: center;
    }

    .group-pill {
      display: flex;
      background: rgba(0, 0, 0, 0.4);
      padding: 3px;
      border-radius: 9px;
      gap: 3px;
    }

    .tool-btn {
      background: transparent;
      border: none;
      color: #d1c1af;
      padding: 7px 12px;
      border-radius: 7px;
      font-size: 11.5px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .tool-btn:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.08);
    }
    .tool-btn.active {
      color: #ffffff;
      background: linear-gradient(135deg, rgba(212, 144, 42, 0.9), rgba(99, 40, 25, 0.9));
      box-shadow: 0 4px 12px rgba(212, 144, 42, 0.25);
    }

    .sep {
      width: 1px;
      height: 20px;
      background: rgba(255, 255, 255, 0.12);
      margin: 0 2px;
    }

    .icon-action {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #dfd3c5;
      width: 34px;
      height: 34px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      transition: all 0.2s ease;
    }
    .icon-action:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #ffffff;
    }
    .icon-action.active {
      background: #d4902a;
      color: #120e0b;
    }

    /* Interactive Spec Modal */
    .spec-modal {
      position: absolute;
      top: 22px;
      right: 24px;
      width: 320px;
      padding: 18px 20px;
      z-index: 10;
      opacity: 0;
      transform: translateY(-8px) scale(0.97);
      pointer-events: none;
      transition: all 0.26s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .spec-modal.visible {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }
    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 8px;
    }
    .tag-badge {
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #d4902a;
      font-weight: 700;
      background: rgba(212, 144, 42, 0.15);
      padding: 3px 8px;
      border-radius: 20px;
    }
    .btn-close {
      background: transparent;
      border: none;
      color: #928373;
      cursor: pointer;
      font-size: 17px;
      padding: 2px 6px;
      border-radius: 6px;
    }
    .btn-close:hover {
      color: #ffffff;
    }
    .spec-modal h3 {
      font-size: 15px;
      font-weight: 700;
      color: #fbf7f0;
      margin-bottom: 6px;
      font-family: 'Cinzel', serif;
    }
    .spec-modal p {
      font-size: 11.5px;
      line-height: 1.5;
      color: #c9b9a8;
      margin-bottom: 12px;
    }
    .spec-grid {
      display: flex;
      flex-direction: column;
      gap: 5px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 10px;
    }
    .spec-item {
      display: flex;
      justify-content: space-between;
      font-size: 10.5px;
    }
    .spec-label { color: #8e7d6c; }
    .spec-val { color: #eae0d4; font-weight: 600; }

    /* Scene Loader */
    #preloader {
      position: absolute;
      inset: 0;
      background: #0b0907;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      transition: opacity 0.75s ease;
    }
    .loader-icon {
      font-size: 42px;
      margin-bottom: 14px;
      animation: gentleFloat 2.2s ease-in-out infinite;
    }
    @keyframes gentleFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-7px); }
    }
    .loader-head {
      font-family: 'Cinzel', serif;
      font-size: 18px;
      letter-spacing: 3px;
      color: #faf5ed;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .loader-desc {
      font-size: 11.5px;
      color: #a89481;
      letter-spacing: 0.8px;
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>

  <!-- Preloader Screen -->
  <div id="preloader">
    <div class="loader-icon">☕</div>
    <div class="loader-head">Artisan Coffee Bar</div>
    <div class="loader-desc">Initializing Photometric Architecture &amp; PBR Shaders...</div>
  </div>

  <!-- WebGL Viewport -->
  <canvas id="webgl-canvas"></canvas>

  <!-- Top Brand Navigation Header -->
  <header class="glass-hud">
    <div class="logo-mark">☕</div>
    <div class="header-info">
      <h1>Bunna &amp; Bloom</h1>
      <p>Artisan Slow-Bar &bull; Architectural Hospitality</p>
    </div>
  </header>

  <!-- Bottom Interactive HUD -->
  <div class="toolbar glass-hud">
    <div class="group-pill">
      <button class="tool-btn active" data-view="default">🎥 3/4 Perspective</button>
      <button class="tool-btn" data-view="espresso">☕ Espresso Hub</button>
      <button class="tool-btn" data-view="siphon">🧪 Siphon Bar</button>
      <button class="tool-btn" data-view="juice">🍹 Hydration Bar</button>
      <button class="tool-btn" data-view="lounge">🛋️ Oak Lounge</button>
    </div>

    <div class="sep"></div>

    <div class="group-pill">
      <button class="tool-btn active" data-light="daylight">☀️ 5000K Morning</button>
      <button class="tool-btn" data-light="golden">🌅 2200K Sunset</button>
      <button class="tool-btn" data-light="evening">🌙 Midnight Ambiance</button>
    </div>

    <div class="sep"></div>

    <button class="icon-action" id="audio-btn" title="Toggle Gentle Cafe Rain & Vinyl Resonance">
      🔊
    </button>
  </div>

  <!-- Interactive Equipment Inspection Modal -->
  <div class="spec-modal glass-hud" id="spec-modal">
    <div class="modal-head">
      <span class="tag-badge" id="modal-tag">Hospitality Spec</span>
      <button class="btn-close" id="btn-close">&times;</button>
    </div>
    <h3 id="modal-title">Equipment</h3>
    <p id="modal-desc">Detailed architectural description.</p>
    <div class="spec-grid" id="modal-grid"></div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

    // =========================================================================
    // 1. Procedural High-Accuracy Texture Generators
    // =========================================================================

    // Flemish-Bond Reclaimed Heritage Red-Clay Brick Texture
    function generateFlemishBrickTextures() {
      const canvas = document.createElement('canvas');
      canvas.width = 1024;
      canvas.height = 1024;
      const ctx = canvas.getContext('2d');

      const bumpCanvas = document.createElement('canvas');
      bumpCanvas.width = 1024;
      bumpCanvas.height = 1024;
      const bCtx = bumpCanvas.getContext('2d');

      // Mortar Ground Base
      ctx.fillStyle = '#6e6357';
      ctx.fillRect(0, 0, 1024, 1024);
      bCtx.fillStyle = '#2b2b2b';
      bCtx.fillRect(0, 0, 1024, 1024);

      const rows = 36;
      const rowHeight = 1024 / rows;
      const stretcherWidth = 110;
      const headerWidth = 52;
      const mortarGap = 3.5;

      const flemishPalette = [
        '#632819', '#562115', '#481c12', '#6b2d1c', 
        '#733220', '#3b170e', '#2e1a12', '#522316'
      ];

      for (let r = 0; r < rows; r++) {
        const y = r * rowHeight + mortarGap / 2;
        const h = rowHeight - mortarGap;
        let x = (r % 2 === 0) ? -stretcherWidth / 2 : 0;
        let isStretcher = (r % 2 === 0);

        while (x < 1024 + stretcherWidth) {
          const w = (isStretcher ? stretcherWidth : headerWidth) - mortarGap;
          const color = flemishPalette[Math.floor(Math.random() * flemishPalette.length)];
          
          ctx.fillStyle = color;
          ctx.fillRect(x + mortarGap / 2, y, w, h);

          // Procedural micro-chipping and weathered variations
          bCtx.fillStyle = '#dcdcdc';
          bCtx.fillRect(x + mortarGap / 2, y, w, h);

          for (let p = 0; p < 8; p++) {
            const px = x + 4 + Math.random() * (w - 8);
            const py = y + 2 + Math.random() * (h - 4);
            const sz = Math.random() * 2.5 + 0.8;
            ctx.fillStyle = Math.random() > 0.4 ? 'rgba(25, 12, 8, 0.28)' : 'rgba(215, 185, 160, 0.16)';
            ctx.fillRect(px, py, sz, sz);
          }

          x += (isStretcher ? stretcherWidth : headerWidth);
          isStretcher = !isStretcher;
        }
      }

      const diffTex = new THREE.CanvasTexture(canvas);
      diffTex.wrapS = THREE.RepeatWrapping;
      diffTex.wrapT = THREE.RepeatWrapping;
      diffTex.repeat.set(2.5, 1.8);

      const bumpTex = new THREE.CanvasTexture(bumpCanvas);
      bumpTex.wrapS = THREE.RepeatWrapping;
      bumpTex.wrapT = THREE.RepeatWrapping;
      bumpTex.repeat.set(2.5, 1.8);

      return { diffTex, bumpTex };
    }

    // 220mm Smoked French Oak Hardwood Flooring (running front-to-back in Z-direction)
    function generateSmokedOakTextures() {
      const canvas = document.createElement('canvas');
      canvas.width = 1024;
      canvas.height = 1024;
      const ctx = canvas.getContext('2d');

      // Base Smoked Oak Color (#231710)
      ctx.fillStyle = '#231710';
      ctx.fillRect(0, 0, 1024, 1024);

      const planksCount = 14;
      const plankW = 1024 / planksCount;
      const tones = ['#231710', '#2a1c13', '#1e140d', '#281a12', '#1b120c'];

      for (let i = 0; i < planksCount; i++) {
        const x = i * plankW;
        ctx.fillStyle = tones[i % tones.length];
        ctx.fillRect(x + 1.2, 0, plankW - 2.4, 1024);

        // Subtle longitudinal grain running along Z
        ctx.strokeStyle = 'rgba(10, 6, 4, 0.32)';
        ctx.lineWidth = 1;
        for (let g = 0; g < 18; g++) {
          const gx = x + Math.random() * plankW;
          ctx.beginPath();
          ctx.moveTo(gx, 0);
          ctx.bezierCurveTo(gx + (Math.random() - 0.5) * 3, 340, gx + (Math.random() - 0.5) * 3, 680, gx, 1024);
          ctx.stroke();
        }
      }

      // V-groove fine bevel seams
      ctx.strokeStyle = 'rgba(0, 0, 0, 0.65)';
      ctx.lineWidth = 2.4;
      for (let i = 0; i <= planksCount; i++) {
        ctx.beginPath();
        ctx.moveTo(i * plankW, 0);
        ctx.lineTo(i * plankW, 1024);
        ctx.stroke();
      }

      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(3, 4);
      return tex;
    }

    // End-Grain Walnut Butcher-Block Countertop Texture
    function generateWalnutCountertopTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');

      // Deep walnut tone #341e13
      ctx.fillStyle = '#341e13';
      ctx.fillRect(0, 0, 512, 512);

      // End-grain parquet bricklets
      const bw = 64;
      const bh = 32;
      const walnutShades = ['#341e13', '#3a2216', '#2d1a10', '#3f2518', '#29170e'];

      for (let y = 0; y < 512; y += bh) {
        const offset = ((y / bh) % 2 === 0) ? 0 : bw / 2;
        for (let x = -offset; x < 512 + bw; x += bw) {
          ctx.fillStyle = walnutShades[Math.floor(Math.random() * walnutShades.length)];
          ctx.fillRect(x + 1, y + 1, bw - 2, bh - 2);

          // Subtle wood ring arcs
          ctx.strokeStyle = 'rgba(255, 210, 160, 0.08)';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.arc(x + bw / 2, y + bh / 2, Math.random() * 16 + 4, 0, Math.PI);
          ctx.stroke();
        }
      }

      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(4, 1);
      return tex;
    }

    // Recessed Chalkboard Typography & Technical Siphon Anatomy
    function generateChalkboardTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 1024;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');

      // Matte charcoal slate
      ctx.fillStyle = '#171918';
      ctx.fillRect(0, 0, 1024, 512);

      // Fine chalk dust patina
      for (let i = 0; i < 35; i++) {
        ctx.fillStyle = 'rgba(255, 255, 255, 0.012)';
        ctx.beginPath();
        ctx.arc(Math.random() * 1024, Math.random() * 512, Math.random() * 100 + 40, 0, Math.PI * 2);
        ctx.fill();
      }

      // Framing double-line border
      ctx.strokeStyle = 'rgba(240, 235, 225, 0.35)';
      ctx.lineWidth = 2.5;
      ctx.strokeRect(18, 18, 1024 - 36, 512 - 36);
      ctx.strokeRect(26, 26, 1024 - 52, 512 - 52);

      // Centered Top Header
      ctx.fillStyle = '#f8f4ec';
      ctx.textAlign = 'center';
      ctx.font = 'bold 26px "Cinzel", serif, sans-serif';
      ctx.fillText('SPECIALTY COFFEE & ARTISANAL SLOW-BAR', 512, 65);

      ctx.beginPath();
      ctx.moveTo(220, 78);
      ctx.lineTo(804, 78);
      ctx.strokeStyle = 'rgba(240, 235, 225, 0.4)';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      // Left Column: Single-Origin Menu & Extraction Parameters
      ctx.textAlign = 'left';
      ctx.font = 'bold 18px "Cinzel", serif, sans-serif';
      ctx.fillStyle = '#e5a33c';
      ctx.fillText('ORIGIN RESERVE ROASTS', 56, 118);

      const origins = [
        ['Yirgacheffe G1 Washed', 'Bergamot, Jasmine, White Peach', '$5.50'],
        ['Guji Hambela Natural', 'Wild Strawberry, Dark Cocoa', '$5.75'],
        ['Sidama Bensa Anaerobic', 'Papaya Nectar, Meyer Lemon', '$6.00'],
        ['Jebena Ancestral Roast', 'Spiced Honey, Roasted Walnut', '$4.25'],
        ['Cascara Botanical Tonic', 'Sun-Dried Coffee Cherries', '$4.50']
      ];

      origins.forEach((item, idx) => {
        const py = 150 + idx * 44;
        ctx.font = 'bold 14px "Plus Jakarta Sans", sans-serif';
        ctx.fillStyle = '#f2ece4';
        ctx.fillText(item[0], 56, py);

        ctx.font = 'italic 11px "Plus Jakarta Sans", sans-serif';
        ctx.fillStyle = '#b3a291';
        ctx.fillText(item[1], 56, py + 16);

        ctx.font = 'bold 13px "Plus Jakarta Sans", sans-serif';
        ctx.fillStyle = '#e5a33c';
        ctx.textAlign = 'right';
        ctx.fillText(item[2], 375, py);
        ctx.textAlign = 'left';
      });

      // Extraction Parameters Callout
      ctx.fillStyle = 'rgba(229, 163, 60, 0.12)';
      ctx.fillRect(56, 385, 320, 68);
      ctx.strokeStyle = 'rgba(229, 163, 60, 0.35)';
      ctx.strokeRect(56, 385, 320, 68);
      ctx.fillStyle = '#e5a33c';
      ctx.font = 'bold 11px "Cinzel", serif';
      ctx.fillText('EXTRACTION BENCHMARK:', 68, 404);
      ctx.font = '11px "Plus Jakarta Sans", monospace';
      ctx.fillStyle = '#e8dfd2';
      ctx.fillText('Dose: 19.5g | Yield: 42g | Temp: 93.4°C', 68, 424);
      ctx.fillText('Pressure: 9.2 Bar | Pre-infuse: 5.5s', 68, 440);

      // Center: Delicate Technical Line Drawing of Vacuum Siphon Anatomy
      ctx.strokeStyle = '#f8f4ec';
      ctx.lineWidth = 2.2;

      // Lower Glass Flask
      ctx.beginPath();
      ctx.arc(512, 245, 42, 0, Math.PI * 2);
      ctx.stroke();

      // Lower Amber Liquid Line
      ctx.fillStyle = 'rgba(212, 130, 42, 0.32)';
      ctx.beginPath();
      ctx.arc(512, 245, 39, 0.2, Math.PI - 0.2);
      ctx.fill();

      // Upper Funnel Chamber
      ctx.strokeRect(492, 122, 40, 72);

      // Connecting Filter Tube
      ctx.beginPath();
      ctx.moveTo(512, 194);
      ctx.lineTo(512, 220);
      ctx.stroke();

      // Stand & Burner Pad
      ctx.beginPath();
      ctx.moveTo(465, 305);
      ctx.lineTo(559, 305);
      ctx.moveTo(470, 305);
      ctx.lineTo(470, 205);
      ctx.lineTo(492, 205);
      ctx.stroke();

      // Center Diagram Labels
      ctx.font = 'italic 10px "Cinzel", serif';
      ctx.fillStyle = '#d4c2af';
      ctx.textAlign = 'center';
      ctx.fillText('Vacuum Siphon Reserve', 512, 332);
      ctx.font = '9px "Plus Jakarta Sans", monospace';
      ctx.fillText('Slow Extraction 92.8°C', 512, 348);

      // Right Column: Boulangerie & Fruit Bar
      ctx.textAlign = 'left';
      ctx.font = 'bold 18px "Cinzel", serif, sans-serif';
      ctx.fillStyle = '#e5a33c';
      ctx.fillText('BOULANGERIE & CRAFT JUICE', 700, 118);

      const goods = [
        ['Normandy Butter Croissant', '84% Cultured French Butter', '$3.75'],
        ['Valrhona Pain au Chocolat', '70% Guanaja Dark Ganache', '$4.50'],
        ['Cardamom Blueberry Brioche', 'Wild Nordic Berries, Brown Sugar', '$4.25'],
        ['Raw Alphonso Mango Nectar', 'Cold-Pressed Valencia & Passionfruit', '$5.25'],
        ['Ruby Beetroot & Pomegranate', 'Organic Ginger Root, Fresh Lime', '$5.50']
      ];

      goods.forEach((item, idx) => {
        const py = 150 + idx * 44;
        ctx.font = 'bold 14px "Plus Jakarta Sans", sans-serif';
        ctx.fillStyle = '#f2ece4';
        ctx.fillText(item[0], 700, py);

        ctx.font = 'italic 11px "Plus Jakarta Sans", sans-serif';
        ctx.fillStyle = '#b3a291';
        ctx.fillText(item[1], 700, py + 16);

        ctx.font = 'bold 13px "Plus Jakarta Sans", sans-serif';
        ctx.fillStyle = '#e5a33c';
        ctx.textAlign = 'right';
        ctx.fillText(item[2], 965, py);
        ctx.textAlign = 'left';
      });

      // Bottom Inscription
      ctx.font = 'italic 12px "Cinzel", serif';
      ctx.fillStyle = '#a89481';
      ctx.textAlign = 'center';
      ctx.fillText('"Every Harvest Tells a Story, Brewed with Uncompromising Precision"', 512, 475);

      return new THREE.CanvasTexture(canvas);
    }

    // Circular Pressure Gauge Face (45mm dial with green extraction and red overpressure arcs, tick marks, needle)
    function generateSoniferPressureGaugeTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 256;
      canvas.height = 256;
      const ctx = canvas.getContext('2d');

      // White/cream dial faceplate
      ctx.fillStyle = '#f8f7f4';
      ctx.beginPath();
      ctx.arc(128, 128, 126, 0, Math.PI * 2);
      ctx.fill();

      // Outer bezel trim
      ctx.strokeStyle = '#222222';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(128, 128, 124, 0, Math.PI * 2);
      ctx.stroke();

      const startAngle = 0.75 * Math.PI;
      const totalSpan = 1.5 * Math.PI;

      // Green Extraction Pressure Arc (8 to 12 Bar)
      ctx.strokeStyle = '#2e7d32';
      ctx.lineWidth = 10;
      ctx.beginPath();
      ctx.arc(128, 128, 100, startAngle + totalSpan * (8 / 16), startAngle + totalSpan * (12 / 16));
      ctx.stroke();

      // Red Over-Pressure Arc (12 to 16 Bar)
      ctx.strokeStyle = '#c62828';
      ctx.lineWidth = 10;
      ctx.beginPath();
      ctx.arc(128, 128, 100, startAngle + totalSpan * (12 / 16), startAngle + totalSpan);
      ctx.stroke();

      // 0-16 Bar Calibration Tick Marks
      for (let i = 0; i <= 16; i++) {
        const angle = startAngle + totalSpan * (i / 16);
        const rInner = i % 4 === 0 ? 84 : 92;
        const rOuter = 108;
        ctx.strokeStyle = '#1a1a1a';
        ctx.lineWidth = i % 4 === 0 ? 3 : 1.5;
        ctx.beginPath();
        ctx.moveTo(128 + Math.cos(angle) * rInner, 128 + Math.sin(angle) * rInner);
        ctx.lineTo(128 + Math.cos(angle) * rOuter, 128 + Math.sin(angle) * rOuter);
        ctx.stroke();
      }

      // Barometer Typography
      ctx.fillStyle = '#1a1a1a';
      ctx.font = 'bold 18px "Plus Jakarta Sans", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('BAR', 128, 172);
      ctx.font = 'bold 9px "Plus Jakarta Sans", sans-serif';
      ctx.fillStyle = '#555555';
      ctx.fillText('EXTRACTION', 128, 186);

      // Black Indicator Needle (Pivoted at ~9.2 Bar optimal delivery)
      const needleAngle = startAngle + totalSpan * (9.2 / 16);
      ctx.strokeStyle = '#111111';
      ctx.lineWidth = 3.5;
      ctx.beginPath();
      ctx.moveTo(128 - Math.cos(needleAngle) * 16, 128 - Math.sin(needleAngle) * 16);
      ctx.lineTo(128 + Math.cos(needleAngle) * 88, 128 + Math.sin(needleAngle) * 88);
      ctx.stroke();

      // Center pivot cap
      ctx.fillStyle = '#111111';
      ctx.beginPath();
      ctx.arc(128, 128, 9, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#c0c0c0';
      ctx.beginPath();
      ctx.arc(128, 128, 4, 0, Math.PI * 2);
      ctx.fill();

      return new THREE.CanvasTexture(canvas);
    }

    // Screen-Printed Sonifer SF3531 Logo Plate Texture
    function generateSoniferLogoTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 256;
      canvas.height = 64;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#e0e0e0';
      ctx.fillRect(0, 0, 256, 64);

      // Fine anisotropic horizontal metal brushing
      ctx.fillStyle = 'rgba(0, 0, 0, 0.035)';
      for (let y = 0; y < 64; y += 2) {

      }

      ctx.fillStyle = '#111111';
      ctx.textAlign = 'center';
      ctx.font = 'bold 26px "Plus Jakarta Sans", sans-serif';
      ctx.fillText('Sonifer', 128, 36);

    // Vintage Pressed Glass Embossed Relief ("Cold Drink / Glassware Company")
    function generateDispenserEmbossedTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');

      // 50% neutral gray for bump mapping
      ctx.fillStyle = '#808080';
      ctx.fillRect(0, 0, 512, 512);

      // Raised concentric glass bead ridges
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.arc(256, 256, 192, 0, Math.PI * 2);
      ctx.stroke();

      ctx.strokeStyle = '#404040';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(256, 256, 186, 0, Math.PI * 2);
      ctx.stroke();

      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 3.5;
      ctx.beginPath();
      ctx.arc(256, 256, 142, 0, Math.PI * 2);
      ctx.stroke();

      // Top arc embossed lettering: "COLD DRINK"
      ctx.save();
      ctx.translate(256, 256);
      ctx.font = 'bold 36px "Cinzel", serif';
      ctx.fillStyle = '#ffffff';
      ctx.textAlign = 'center';
      const textTop = "COLD DRINK";
      for (let i = 0; i < textTop.length; i++) {
        const char = textTop[i];
        const theta = -Math.PI / 2 + (i - (textTop.length - 1) / 2) * 0.18;
        ctx.save();
        ctx.rotate(theta);
        ctx.translate(0, -158);
        ctx.fillText(char, 0, 0);
        ctx.restore();
      }

      // Center Star Medallion
      ctx.font = 'bold 44px serif';
      ctx.fillText('★', 0, 14);

      // Bottom arc embossed lettering: "GLASSWARE CO."
      const textBot = "GLASSWARE CO.";
      for (let i = 0; i < textBot.length; i++) {
        const char = textBot[i];
        const theta = Math.PI / 2 - (i - (textBot.length - 1) / 2) * 0.17;
        ctx.save();
        ctx.rotate(theta);
        ctx.translate(0, 168);
        ctx.rotate(Math.PI);
        ctx.fillText(char, 0, 0);
        ctx.restore();
      }
      ctx.restore();

      return new THREE.CanvasTexture(canvas);
    }

    // Traditional Regional Floral Decal Pattern for Espresso Ceramic Cup
    function generateFloralDecalTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 256;
      const ctx = canvas.getContext('2d');

      // Pure porcelain glaze
      ctx.fillStyle = '#f8f6f0';
      ctx.fillRect(0, 0, 512, 256);

      // Traditional gold and terracotta trim bands
      ctx.fillStyle = '#d4af37';
      ctx.fillRect(0, 18, 512, 6);
      ctx.fillStyle = '#8b2e1b';
      ctx.fillRect(0, 28, 512, 4);

      ctx.fillStyle = '#8b2e1b';
      ctx.fillRect(0, 224, 512, 4);
      ctx.fillStyle = '#d4af37';
      ctx.fillRect(0, 232, 512, 6);

      // Repeating floral rosettes along cup circumference
      for (let x = 32; x < 512; x += 64) {
        ctx.fillStyle = '#8b2e1b';
        ctx.beginPath();
        ctx.arc(x, 128, 12, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#d4af37';
        ctx.beginPath();
        ctx.arc(x, 128, 5, 0, Math.PI * 2);
        ctx.fill();

        // 6 terracotta petals
        for (let p = 0; p < 6; p++) {
          const angle = (p * Math.PI) / 3;
          const px = x + Math.cos(angle) * 22;
          const py = 128 + Math.sin(angle) * 22;
          ctx.fillStyle = '#c46238';
          ctx.beginPath();
          ctx.arc(px, py, 9, 0, Math.PI * 2);
          ctx.fill();
        }

        // Green leaf sprigs
        ctx.fillStyle = '#3e5c32';
        ctx.beginPath();
        ctx.ellipse(x + 28, 128, 7, 3.5, 0.4, 0, Math.PI * 2);
        ctx.fill();
      }

      return new THREE.CanvasTexture(canvas);
    }

    fruitBasket.add(pineBody);

    for (let l = 0; l < 8; l++) {
      const leaf = new THREE.Mesh(new THREE.ConeGeometry(0.016, 0.11, 4), new THREE.MeshStandardMaterial({ color: 0x325224 }));
      leaf.position.set(0.03 + (Math.random() - 0.5) * 0.03, 0.23, -0.02 + (Math.random() - 0.5) * 0.03);
      leaf.rotation.z = (Math.random() - 0.5) * 0.5;
      leaf.rotation.x = (Math.random() - 0.5) * 0.5;
      fruitBasket.add(leaf);
    }

    // Fresh whole lemons and oranges
    const fruits = [
      { color: 0xfbc02d, r: 0.036, x: -0.08, z: 0.04 }, // Lemon
      { color: 0xf57c00, r: 0.042, x: 0.02, z: 0.08 },  // Orange
      { color: 0xfbc02d, r: 0.034, x: -0.05, z: -0.06 },// Lemon
      { color: 0xf57c00, r: 0.040, x: 0.09, z: 0.05 },  // Orange
      { color: 0xfbc02d, r: 0.035, x: -0.09, z: -0.02 } // Lemon
    ];
    fruits.forEach(f => {
      const fruit = new THREE.Mesh(
        new THREE.SphereGeometry(f.r, 14, 14),
        new THREE.MeshStandardMaterial({ color: f.color, roughness: 0.45 })
      );
      fruit.position.set(f.x, 0.075 + f.r, f.z);
      fruit.castShadow = true;
      fruitBasket.add(fruit);
    });
    serviceBar.add(fruitBasket);

    registerInteractive(fruitBasket, {
      title: "Woven Sweetgrass Fresh Fruit Basket",
      tag: "Zone 7: Far Right Corner",
      desc: "Shallow woven sweetgrass basket displaying ripe whole lemons, navel oranges, and a crown-topped spiky pineapple for fresh cold-pressed extraction.",
      specs: [
        ["Craft", "Hand-Woven Natural Ethiopian Raffia Sweetgrass"],
        ["Produce", "Unwaxed Organic Lemons, Valencia Oranges, Whole Pineapple"]
      ]
    });

    // =========================================================================
    // 6. Customer Seating & Restrained Textiles
    // =========================================================================

    const seatingZone = new THREE.Group();
    scene.add(seatingZone);

    // Fixed Low-Profile Bench Seating along Right-Hand Wall (X = +4.8m)
    const benchGroup = new THREE.Group();
    benchGroup.position.set(4.8, 0, 0);

    // Slatted Oak Base
    const benchBase = new THREE.Mesh(new THREE.BoxGeometry(0.72, 0.38, 4.8), materials.counterFlutedSlat);
    benchBase.position.y = 0.19;
    benchBase.castShadow = true;
    benchBase.receiveShadow = true;
    benchGroup.add(benchBase);

    // Continuous Tailored Chocolate-Brown Saddle Leather Seat Pad
    const seatPad = new THREE.Mesh(new THREE.BoxGeometry(0.75, 0.11, 4.8), materials.saddleLeather);
    seatPad.position.y = 0.435;
    seatPad.castShadow = true;
    benchGroup.add(seatPad);

    // Tailored Square Cushions (450mm × 450mm) - Strict Restraint: 4 Cushions at Corners
    const pillowGeo = new THREE.BoxGeometry(0.18, 0.45, 0.45);
    const cushionList = [
      { z: -2.0, mat: materials.heavyweightCreamLinen, rotZ: 0.15, rotY: 0.12 },
      { z: -1.4, mat: materials.terracottaBoucle, rotZ: 0.18, rotY: -0.14 },
      { z: 1.4, mat: materials.mutedMossGreen, rotZ: 0.16, rotY: 0.10 },
      { z: 2.0, mat: materials.heavyweightCreamLinen, rotZ: 0.14, rotY: -0.16 }
    ];

    cushionList.forEach(c => {
      const cushion = new THREE.Mesh(pillowGeo, c.mat);
      cushion.position.set(-0.16, 0.65, c.z);
      cushion.rotation.z = c.rotZ;
      cushion.rotation.y = c.rotY;
      cushion.castShadow = true;
      benchGroup.add(cushion);
    });

    seatingZone.add(benchGroup);

    // Two Minimalist Round Bistro Tables (650mm diameter walnut tops on cast-iron trumpet bases)
    function buildBistroTable(zPos) {
      const table = new THREE.Group();
      table.position.set(3.6, 0, zPos);

      // Cast-Iron Trumpet Base
      const trumpetBase = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.24, 0.06, 24), materials.blackenedStructuralSteel);
      trumpetBase.position.y = 0.03;
      trumpetBase.castShadow = true;
      table.add(trumpetBase);

      const centralColumn = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.64, 16), materials.blackenedStructuralSteel);
      centralColumn.position.y = 0.36;
      centralColumn.castShadow = true;
      table.add(centralColumn);

      // 650mm Solid Walnut Top
      const tableTop = new THREE.Mesh(new THREE.CylinderGeometry(0.325, 0.325, 0.038, 32), materials.endGrainWalnut);
      tableTop.position.y = 0.70;
      tableTop.castShadow = true;
      tableTop.receiveShadow = true;
      table.add(tableTop);

      seatingZone.add(table);
      return table;
    }

    buildBistroTable(-0.8);
    buildBistroTable(1.4);

    // Tubular Blackened-Steel Dining Chairs with Bent Walnut Veneer Backrests
    function buildDiningChair(xPos, zPos, rotY) {
      const chair = new THREE.Group();
      chair.position.set(xPos, 0, zPos);
      chair.rotation.y = rotY;

      // Charcoal Textile Seat
      const cSeat = new THREE.Mesh(
        new THREE.CylinderGeometry(0.20, 0.20, 0.04, 20),
        new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.88 })
      );
      cSeat.position.y = 0.44;
      cSeat.castShadow = true;
      chair.add(cSeat);

      // Steam-Bent Walnut Veneer Backrest
      const cBack = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.16, 0.022), materials.endGrainWalnut);
      cBack.position.set(0, 0.72, -0.16);
      cBack.castShadow = true;
      chair.add(cBack);

      // Tubular Blackened Steel Legs
      [[-0.14, -0.14], [0.14, -0.14], [-0.14, 0.14], [0.14, 0.14]].forEach(([lx, lz]) => {
        const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.011, 0.008, 0.43, 8), materials.blackenedStructuralSteel);
        leg.position.set(lx, 0.215, lz);
        leg.castShadow = true;
        chair.add(leg);
      });

      seatingZone.add(chair);
      return chair;
    }

    buildDiningChair(2.9, -0.8, Math.PI / 2);
    buildDiningChair(2.9, 1.4, Math.PI / 2);

    // =========================================================================
    // 7. Precision Photometric Lighting Design & Suspended Ladder Rig
    // =========================================================================

    const lightingSystem = new THREE.Group();
    scene.add(lightingSystem);

    // Suspended Overhead Feature: Vintage Five-Rung Wooden Utility Ladder (3.4m × 0.50m) at Y = 2.60m
    // Strict requirement: No cups attached to the ladder or pendant cords.
    const ladderGroup = new THREE.Group();
    ladderGroup.position.set(0, 2.60, barCenterZ);

    // Ladder Rails
    const railMat = materials.reclaimedTimberBeam;
    const lRailA = new THREE.Mesh(new THREE.BoxGeometry(3.4, 0.06, 0.05), railMat);
    lRailA.position.z = -0.225;
    lRailA.castShadow = true;

    const lRailB = new THREE.Mesh(new THREE.BoxGeometry(3.4, 0.06, 0.05), railMat);
    lRailB.position.z = 0.225;
    lRailB.castShadow = true;
    ladderGroup.add(lRailA, lRailB);

    // Exactly 5 Ladder Rungs
    const rungPositions = [-1.36, -0.68, 0.0, 0.68, 1.36];
    rungPositions.forEach(rx => {
      const rung = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.035, 0.45), railMat);
      rung.position.set(rx, 0, 0);
      rung.castShadow = true;
      ladderGroup.add(rung);
    });

    // 4 Matte-Black Braided Steel Cables (2mm diameter) Anchored to Ceiling Beams
    const cableMat = materials.blackenedStructuralSteel;
    [[-1.5, -0.225], [1.5, -0.225], [-1.5, 0.225], [1.5, 0.225]].forEach(([cx, cz]) => {
      const cable = new THREE.Mesh(new THREE.CylinderGeometry(0.001, 0.001, 1.0, 8), cableMat);
      cable.position.set(cx, 0.50, cz);
      ladderGroup.add(cable);
    });
    lightingSystem.add(ladderGroup);

    // Exactly 5 Twisted Black Cloth Cord Pendants Dropping Through Ladder Rungs
    // Staggered deliberate elevations: dropping from Y = 2.35m down to Y = 2.05m
    const edisonFixtures = [];
    const bulbDropConfig = [
      { x: -1.36, y: 2.30, intensity: 1.6 },
      { x: -0.68, y: 2.12, intensity: 1.6 },
      { x: 0.00,  y: 2.35, intensity: 1.6 },
      { x: 0.68,  y: 2.05, intensity: 1.6 },
      { x: 1.36,  y: 2.22, intensity: 1.6 }
    ];

    bulbDropConfig.forEach((cfg, idx) => {
      const fixture = new THREE.Group();
      fixture.position.set(cfg.x, cfg.y, barCenterZ);

      // Cord extending up to ladder (ladder at Y = 2.60m)
      const cordLen = 2.60 - cfg.y;
      const cord = new THREE.Mesh(new THREE.CylinderGeometry(0.002, 0.002, cordLen, 6), materials.blackenedStructuralSteel);
      cord.position.y = cordLen / 2;
      fixture.add(cord);

      // Brass Socket Cap
      const socket = new THREE.Mesh(new THREE.CylinderGeometry(0.022, 0.022, 0.055, 14), materials.solidBrass);
      socket.position.y = 0.027;
      fixture.add(socket);

      // Tear-drop clear ST64 glass bulb
      const st64 = new THREE.Mesh(new THREE.SphereGeometry(0.048, 16, 16), materials.borosilicateGlass);
      st64.scale.set(1, 1.45, 1);
      st64.position.y = -0.045;
      fixture.add(st64);

      // Glowing Double-Spiral Coiled Filament Wire (emissive: 0xffa033, emissiveIntensity: 4.5)
      const filament = new THREE.Mesh(new THREE.CylinderGeometry(0.011, 0.011, 0.042, 10), materials.glowingFilamentWire);
      filament.position.y = -0.042;
      fixture.add(filament);

      // Photometric PointLight: 2200K vintage ultra-warm amber (#ff9c38)
      // Radius: 5.0m, decay: 2.0, shadow map: 1024x1024, bias: -0.002
      const pointLight = new THREE.PointLight(0xff9c38, cfg.intensity, 5.0, 2.0);
      pointLight.position.y = -0.045;
      pointLight.castShadow = true;
      pointLight.shadow.mapSize.width = 1024;
      pointLight.shadow.mapSize.height = 1024;
      pointLight.shadow.bias = -0.002;
      fixture.add(pointLight);

      lightingSystem.add(fixture);
      edisonFixtures.push({ fixture, pointLight, filament, baseIntensity: cfg.intensity });
    });

    // Natural Sunlight (Primary Scene Key):
    // Position: X = -7.5m, Y = 5.5m, Z = 2.5m, Color: 5000K (#fff1e0), Intensity: 2.4
    const sunlight = new THREE.DirectionalLight(0xfff1e0, 2.4);
    sunlight.position.set(-7.5, 5.5, 2.5);
    sunlight.target.position.set(0, 0.9, -1.0);
    sunlight.castShadow = true;
    sunlight.shadow.mapSize.width = 2048;
    sunlight.shadow.mapSize.height = 2048;
    sunlight.shadow.bias = -0.001;
    lightingSystem.add(sunlight);
    lightingSystem.add(sunlight.target);

    // Architectural Counter Kick-Plate Underglow (Concealed Warm LED Linear Wash: 2700K #ffaa44, intensity: 0.6)
    [-1.6, 0.0, 1.6].forEach(kx => {
      const kickLight = new THREE.PointLight(0xffaa44, 0.22, 1.8, 2.0);
      kickLight.position.set(kx, 0.06, barCenterZ + 0.46);
      lightingSystem.add(kickLight);
    });

    // Chalkboard Graze Spots: Two ceiling-recessed brass spot heads (SpotLight, angle: 0.35, penumbra: 0.5, intensity: 1.1)
    [-1.2, 1.2].forEach(sx => {
      const spot = new THREE.SpotLight(0xffe6cb, 1.1, 4.5, 0.35, 0.5, 2.0);
      spot.position.set(sx, 3.45, -2.5);
      spot.target.position.set(sx, 2.1, -3.58);
      lightingSystem.add(spot);
      lightingSystem.add(spot.target);
    });

    // Ambient Fill: Rich Warm Sepia Tone (#2c1d14, intensity: 0.6)
    const ambientLight = new THREE.AmbientLight(0x2c1d14, 0.6);
    lightingSystem.add(ambientLight);

    // =========================================================================
    // 8. Dynamic Rising Coffee Steam System
    // =========================================================================

    const steamCount = 35;
    const steamGeo = new THREE.BufferGeometry();
    const steamPos = new Float32Array(steamCount * 3);
    const steamData = [];

    const emitterAnchors = [
      new THREE.Vector3(-0.95, 1.36, barCenterZ),        // Siphon 1
      new THREE.Vector3(-0.64, 1.36, barCenterZ),        // Siphon 2
      new THREE.Vector3(0.72, 1.05, barCenterZ + 0.08),  // Sonifer 1 Steam Wand
      new THREE.Vector3(1.06, 1.05, barCenterZ + 0.08),  // Sonifer 2 Steam Wand
      new THREE.Vector3(-0.075, 1.02, barCenterZ + 0.32) // Ethiopian Hospitality Cup
    ];

    for (let i = 0; i < steamCount; i++) {
      const anchor = emitterAnchors[i % emitterAnchors.length];
      steamPos[i * 3] = anchor.x + (Math.random() - 0.5) * 0.03;
      steamPos[i * 3 + 1] = anchor.y + Math.random() * 0.25;
      steamPos[i * 3 + 2] = anchor.z + (Math.random() - 0.5) * 0.03;
      steamData.push({
        anchor,
        vy: 0.003 + Math.random() * 0.005,
        vx: (Math.random() - 0.5) * 0.0015,
        vz: (Math.random() - 0.5) * 0.0015
      });
    }
    steamGeo.setAttribute('position', new THREE.BufferAttribute(steamPos, 3));

    const sCanvas = document.createElement('canvas');
    sCanvas.width = 32;
    sCanvas.height = 32;
    const sCtx = sCanvas.getContext('2d');
    const sGrad = sCtx.createRadialGradient(16, 16, 0, 16, 16, 16);
    sGrad.addColorStop(0, 'rgba(255, 255, 255, 0.35)');
    sGrad.addColorStop(0.5, 'rgba(255, 255, 255, 0.12)');
    sGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');
    sCtx.fillStyle = sGrad;
    sCtx.fillRect(0, 0, 32, 32);

    const steamMat = new THREE.PointsMaterial({
      size: 0.16,
      map: new THREE.CanvasTexture(sCanvas),
      transparent: true,
      opacity: 0.32,
      depthWrite: false,
      blending: THREE.AdditiveBlending
    });
    const steamParticles = new THREE.Points(steamGeo, steamMat);
    scene.add(steamParticles);

    function updateSteamSimulation() {
      const pos = steamParticles.geometry.attributes.position.array;
      for (let i = 0; i < steamCount; i++) {
        pos[i * 3 + 1] += steamData[i].vy;
        pos[i * 3] += steamData[i].vx;
        pos[i * 3 + 2] += steamData[i].vz;
        if (pos[i * 3 + 1] > steamData[i].anchor.y + 0.40) {
          pos[i * 3] = steamData[i].anchor.x + (Math.random() - 0.5) * 0.03;
          pos[i * 3 + 1] = steamData[i].anchor.y;
          pos[i * 3 + 2] = steamData[i].anchor.z + (Math.random() - 0.5) * 0.03;
        }
      }
      steamParticles.geometry.attributes.position.needsUpdate = true;
    }

    // =========================================================================
    // 9. Camera Choreography & Preset Transitions
    // =========================================================================

    const views = {
      default: {
        pos: new THREE.Vector3(-2.8, 1.55, 3.2),
        target: new THREE.Vector3(0, 1.0, -1.2)
      },
      espresso: {
        pos: new THREE.Vector3(0.80, 1.38, -0.40),
        target: new THREE.Vector3(0.80, 1.10, barCenterZ)
      },
      siphon: {
        pos: new THREE.Vector3(-0.80, 1.38, -0.45),
        target: new THREE.Vector3(-0.80, 1.15, barCenterZ)
      },
      juice: {
        pos: new THREE.Vector3(2.07, 1.42, -0.40),
        target: new THREE.Vector3(2.07, 1.15, barCenterZ)
      },
      lounge: {
        pos: new THREE.Vector3(2.4, 1.50, 1.8),
        target: new THREE.Vector3(4.6, 0.85, 0.2)
      }
    };

    let targetCam = camera.position.clone();
    let targetTarget = controls.target.clone();
    let isMovingCam = false;

    function activateView(viewKey) {
      const v = views[viewKey];
      if (!v) return;
      targetCam.copy(v.pos);
      targetTarget.copy(v.target);
      isMovingCam = true;
    }

    // Photometric Atmosphere Modes
    function setLightingMode(mode) {
      if (mode === 'daylight') {
        sunlight.color.setHex(0xfff1e0);
        sunlight.intensity = 2.4;
        sunlight.position.set(-7.5, 5.5, 2.5);
        ambientLight.color.setHex(0x2c1d14);
        ambientLight.intensity = 0.60;
        edisonFixtures.forEach(f => f.pointLight.intensity = f.baseIntensity);
        if (bloomPass) bloomPass.strength = 0.28;
      } else if (mode === 'golden') {
        sunlight.color.setHex(0xffaa44);
        sunlight.intensity = 1.6;
        sunlight.position.set(-7.5, 3.2, 2.0);
        ambientLight.color.setHex(0x381f12);
        ambientLight.intensity = 0.48;
        edisonFixtures.forEach(f => f.pointLight.intensity = f.baseIntensity * 1.35);
        if (bloomPass) bloomPass.strength = 0.42;
      } else if (mode === 'evening') {
        sunlight.color.setHex(0x1a2638);
        sunlight.intensity = 0.35;
        ambientLight.color.setHex(0x18100a);
        ambientLight.intensity = 0.28;
        edisonFixtures.forEach(f => f.pointLight.intensity = f.baseIntensity * 1.8);
        if (bloomPass) bloomPass.strength = 0.65;
      }
    }

    // =========================================================================
    // 10. Procedural Ambient Rain & Vinyl Resonance Audio
    // =========================================================================

    let audioContext = null;
    let isSoundOn = false;
    let masterGain = null;

    function startProceduralAudio() {
      if (audioContext) return;
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      audioContext = new AudioCtx();

      const bufferSize = audioContext.sampleRate * 2;
      const noiseBuffer = audioContext.createBuffer(1, bufferSize, audioContext.sampleRate);
      const out = noiseBuffer.getChannelData(0);
      let b0 = 0, b1 = 0, b2 = 0;
      for (let i = 0; i < bufferSize; i++) {
        const white = Math.random() * 2 - 1;
        b0 = 0.99886 * b0 + white * 0.0555179;
        b1 = 0.99332 * b1 + white * 0.0750759;
        b2 = 0.96900 * b2 + white * 0.1538520;
        out[i] = (b0 + b1 + b2) * 0.06;
      }

      const whiteSrc = audioContext.createBufferSource();
      whiteSrc.buffer = noiseBuffer;
      whiteSrc.loop = true;

      const lowpass = audioContext.createBiquadFilter();
      lowpass.type = 'lowpass';
      lowpass.frequency.setValueAtTime(540, audioContext.currentTime);

      masterGain = audioContext.createGain();
      masterGain.gain.setValueAtTime(0, audioContext.currentTime);

      whiteSrc.connect(lowpass);
      lowpass.connect(masterGain);
      masterGain.connect(audioContext.destination);
      whiteSrc.start();
    }

    function toggleSound() {
      startProceduralAudio();
      if (audioContext.state === 'suspended') audioContext.resume();
      isSoundOn = !isSoundOn;
      const btn = document.getElementById('audio-btn');
      if (isSoundOn) {
        masterGain.gain.setTargetAtTime(0.22, audioContext.currentTime, 0.4);
        btn.classList.add('active');
        btn.innerHTML = '🔊';
      } else {
        masterGain.gain.setTargetAtTime(0, audioContext.currentTime, 0.4);
        btn.classList.remove('active');
        btn.innerHTML = '🔇';
      }
    }

    // =========================================================================
    // 11. Raycasting & Interactive Modal Inspections
    // =========================================================================

    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    const modal = document.getElementById('spec-modal');
    const modalTitle = document.getElementById('modal-title');
    const modalTag = document.getElementById('modal-tag');
    const modalDesc = document.getElementById('modal-desc');
    const modalGrid = document.getElementById('modal-grid');

    function onPointerDown(event) {
      if (event.target.closest('.glass-hud')) return;
      pointer.x = (event.clientX / window.innerWidth) * 2 - 1;
      pointer.y = -(event.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(pointer, camera);
      const hits = raycaster.intersectObjects(interactiveObjects, false);

      if (hits.length > 0) {
        const d = hits[0].object.userData;
        if (d && d.title) {
          modalTitle.textContent = d.title;
          modalTag.textContent = d.tag || "Boutique Hospitality";
          modalDesc.textContent = d.desc;
          modalGrid.innerHTML = '';
          if (d.specs) {
            d.specs.forEach(([lbl, val]) => {
              const row = document.createElement('div');
              row.className = 'spec-item';
              row.innerHTML = `<span class="spec-label">${lbl}</span><span class="spec-val">${val}</span>`;
              modalGrid.appendChild(row);
            });
          }
          modal.classList.add('visible');
        }
      }
    }

    document.getElementById('btn-close').addEventListener('click', () => {
      modal.classList.remove('visible');
    });
    window.addEventListener('pointerdown', onPointerDown);

    // Button Bindings
    document.querySelectorAll('[data-view]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('[data-view]').forEach(b => b.classList.remove('active'));
        e.currentTarget.classList.add('active');
        activateView(e.currentTarget.dataset.view);
      });
    });

    document.querySelectorAll('[data-light]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('[data-light]').forEach(b => b.classList.remove('active'));
        e.currentTarget.classList.add('active');
        setLightingMode(e.currentTarget.dataset.light);
      });
    });

    document.getElementById('audio-btn').addEventListener('click', toggleSound);

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      if (composer) composer.setSize(window.innerWidth, window.innerHeight);
    });

    setTimeout(() => {
      const loader = document.getElementById('preloader');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(() => loader.remove(), 750);
      }
    }, 550);

    // =========================================================================
    // 12. Main Architectural Render Loop
    // =========================================================================

    const clock = new THREE.Clock();

    function renderLoop() {
      requestAnimationFrame(renderLoop);
      const elapsed = clock.getElapsedTime();

      // Camera Lerp
      if (isMovingCam) {
        camera.position.lerp(targetCam, 0.05);
        controls.target.lerp(targetTarget, 0.05);
        if (camera.position.distanceTo(targetCam) < 0.03 && controls.target.distanceTo(targetTarget) < 0.03) {
          camera.position.copy(targetCam);
          controls.target.copy(targetTarget);
          isMovingCam = false;
        }
      }

      controls.update();

      // Delicate filament pulse
      edisonFixtures.forEach((f, i) => {
        f.pointLight.intensity = f.baseIntensity + Math.sin(elapsed * 4 + i) * 0.04;
      });

      // Steam Particle Simulation
      updateSteamSimulation();

      // Render
      if (composer) {
        composer.render();
      } else {
        renderer.render(scene, camera);
      }
    }

    renderLoop();
  </script>
</body>
</html>
